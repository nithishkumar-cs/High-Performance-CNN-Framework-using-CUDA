    reason: The user asked for a trainable C/CUDA framework; external-Darknet weights alone are not evidence of native training. The corrected native pretrained-backbone run now reaches 0.59801 validation mAP, above the external-Darknet baseline (0.57612), while from-scratch runs remain near zero.
  - item: Use Jetson for future training runs.
    reason: The user chose laptop-only training and Jetson-only inference.
  - item: Reintroduce unrelated PyTorch/Ultralytics implementation as the project core or compare YOLOv8n as if it were the same Darknet model.
    reason: The user corrected that scope; Ultralytics may be used only for a genuinely comparable baseline.
  - item: Fabricate, backdate, or auto-generate (e.g. via an activity-generator tool) commit dates/history to make the work look older or predate this assistance.
    reason: The user asked for spread-out weekend-dated commits going back a year; the assistant refused and the user accepted an honest history going forward instead (commits may still note a genuine, evidence-backed approximate prior timeline in prose, not in commit dates).
architecture:
  - component: Full YOLOv3/Darknet-53 end-to-end validation
    responsibility: Confirm this project's native framework parses and trains the real, full-size YOLOv3 architecture (53-layer Darknet-53 backbone with shortcut/residual blocks, 3 route/upsample detection scales), not just the "-tiny" variants already trained to completion.
    contracts: "runs/yolov3-voc/yolov3-voc.cfg (2026-10-26) is pjreddie/darknet's own cfg/yolov3.cfg (extracted from the darknet-train:gpu Docker image) adapted the same way as yolov3-tiny-voc.cfg - width/height 608->416, filters 255->75 and classes 80->20 at each of the 3 pre-yolo convs, COCO anchors left unchanged. `cuda_detector.exe inspect` confirmed the full 106-layer graph parses correctly end-to-end (Darknet-53 backbone, every shortcut/route/upsample resolving, 3 yolo heads at 13x13/26x26/52x52). Smoke-trained on 2 real VOC images (2026-10-26): CUDA backend, 3 epochs/batch 2, finite falling loss (8680.83 -> 1131.16 -> 159.793) in 2.18s; CPU backend, 1 image/1 epoch, finite loss (8650.22) in 2m43s - confirms CPU is impractically slow for this architecture's scale (expected, consistent with the YOLOv2/Darknet19 finding) and CUDA is the only practical training backend. No shape/parsing bugs were found this time (unlike YOLOv2's route-passthrough bug) - the shortcut layer and multi-source route support added earlier already covered everything this cfg needs. TensorRT/ONNX export remains not done (trt_session.cpp is still YOLOv3-tiny-specific, hardcoding exactly two yolo heads; this architecture has 3). Fetched the real ImageNet-pretrained backbone (data/darknet53.conv.74, 162,482,580 bytes, from data.pjreddie.com - same precedent as the YOLOv2/YOLOv3-tiny backbone fetches, gitignored) and verified the partial-load boundary is exact: `--init-layers 75` loads cleanly, `--init-layers 76` fails with 'truncated Darknet weights at layer 75', confirming layers [0,75) are exactly this backbone's architecture. VRAM/batch probe on this 8GB laptop GPU (32 real images): batch=16 degraded to ~2.4s/image (the same VRAM-overflow shared-memory fallback pattern YOLOv2 hit at batch=32); batch=8 ran cleanly at ~0.12s/image with stable VRAM (7766-7771/8192 MiB, not climbing) - batch=8 is the safe choice. Launched the full 71-epoch/320,210-image retrain detached 2026-10-26 (.agent-work/full_retrain_yolov3_darknet53.ps1, hidden window, PID 11848; same recipe pattern as the other two architectures: --init data/darknet53.conv.74 --init-layers 75 --batch 8 --lr 0.001 --burn-in 1000 --steps 32000,36000 --scales .1,.1 --momentum 0.9 plus flip/HSV/crop jitter, scaled proportionally from YOLOv2's batch-16/20,021-minibatch schedule to this run's batch-8/40,026-minibatch total). First epoch finished in ~17 minutes (mean_loss=1772.74, 10,884 positives), but training then crashed during epoch 2 with 'non-finite CUDA training loss' (cuda_training.cu's own NaN/Inf guard) - this deeper, mostly-randomly-initialized head (8 extra conv layers after the pretrained backbone, feeding sigmoid/softmax-based losses) diverged at momentum 0.9's ~10x effective step size with lr=0.001, unlike YOLOv2/YOLOv3-tiny which stayed stable at that same lr/momentum. Relaunched (same PID-replacing process, same script) with --lr 0.0001 (10x lower, matching the earlier stable smoke-test LR for this exact cfg) and otherwise identical settings; ran stably past the point of the first crash with no non-finite error, confirming this mitigates it, though the lower LR will need more than 71 epochs' worth of the original schedule to fully converge and the --steps/--scales step-decay boundaries (32000/36000) were tuned for the original lr and may need revisiting once more epochs land. Checkpoint/log: runs/yolov3-voc-pretrained-full-budget.weights, .agent-work/full_retrain_yolov3_darknet53.log (overwritten by the relaunch). Next: let it run to completion (monitor for further instability and the actual per-epoch rate at this LR), then evaluate val/test mAP@0.5 with the native CUDA evaluator against the other two architectures, and consider whether a gradient-clipping safeguard would make future deep-architecture retrains more robust than relying on LR tuning alone. UPDATE 2026-10-26: the relaunched (lr=0.0001) run completed all 71 epochs with no further instability (final epoch=71 mean_loss=8.07434, checkpoint runs/yolov3-voc-pretrained-full-budget.weights saved 07:25 local, log .agent-work/full_retrain_yolov3_darknet53.log). Evaluated with the same native CUDA evaluator settings as the other two architectures (confidence 0.01, class-aware NMS IoU 0.45): mAP@0.5=0.62098 on the same 501 validation images/1,305 non-difficult objects (2,853 predictions, .agent-work/yolov3_darknet53_full_budget_val_eval.log) and mAP@0.5=0.61593 on the full VOC2007 test split (4,952 images, 12,032 non-difficult objects, 27,052 predictions, .agent-work/yolov3_darknet53_full_budget_test_eval.log) - the best of all three native architectures (YOLOv3-tiny 0.59801 val/0.58182 test, YOLOv2/Darknet19 0.56054 val/0.57215 test), consistent with a deeper, higher-capacity backbone and 3 detection scales. This confirms this framework trains the real, full-size YOLOv3/Darknet-53 architecture to a working, generalizing, best-in-project detector, not just the -tiny variant. Not yet deployed to Jetson or exported to ONNX/TensorRT (trt_session.cpp remains YOLOv3-tiny-specific, hardcoding two yolo heads; this architecture has three)."
  - component: Git remote and Jetson deployment environment
    responsibility: Source control for this repo and the remote target used for inference/deployment benchmarking (never training).
    contracts: "GitHub origin `nithishkumar-cs/High-Performance-CNN-Framework-using-CUDA`, commits authored as `Nithish Kumar <nithishk.cs@gmail.com>`; pushes to `main` need the user's explicit approval each time (sandbox auto-review blocks unapproved pushes). Jetson reachable via SSH alias `jetson-ts` (also `jetson`): a Jetson Orin Nano Super on JetPack R36.5 with TensorRT 10.3; benchmarks default to the board's 25W mode unless stated otherwise. The same Jetson also hosts a separate ROS 2 robotics repo, `/home/nithish/projects/robotics/jetauto_orin_amr` (its own DESIGN.yaml there) - a JetAuto AMR perception/fusion/SLAM/Nav2/safety stack whose `perception_detector` package is C++/TensorRT-only and currently deploys the stock YOLO26n COCO ONNX/TensorRT engine (training is explicitly out of that repo's scope). Complementary, not overlapping: this repo could supply that stack's detector engine (via its own ONNX export path, replacing the placeholder YOLO26n through that repo's backend factory/config) as the 'trained the detector from scratch, deployed it into a robot stack' end-to-end story, but no such integration has been done (checked read-only 2026-10-29, req-77)."
  - component: Root CMakeLists.txt, original CUDA CNN, and native CLI programs
    responsibility: Build the newer detector_core C++17 library and detector/classifier inspect, train, evaluate and benchmark executables while retaining the original fixed-shape MNIST CUDA CNN as project history.
    contracts: "CMake options DETECTOR_CUDA, DETECTOR_OPENCV and DETECTOR_TENSORRT select optional backends; TensorRT requires CUDA. Both the restored original CNN files and the full native/ framework (CMakeLists.txt included) are committed. Local CUDA build/test invocation on this Windows laptop (plain cmake/ninja/ctest are not on PATH) - run 'C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Auxiliary\\Build\\vcvars64.bat', then use the MSVC-bundled cmake.exe/ninja.exe/ctest.exe under '...\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin' and '...\\CMake\\Ninja', configuring with -DDETECTOR_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 -G Ninja. Running an already-built native exe (e.g. cuda_detector_train.exe) needs none of this - only configuring/building does; a vcvars64.bat call in a launch script is unnecessary and risks failing on its own (e.g. a missing vswhere.exe) before the program even starts, as happened to an interrupted long-retrain launch attempt on 2026-10-06 whose log never reached the program's own startup line."
  - component: cuDNN build infrastructure (DETECTOR_CUDNN, third_party/cudnn, native/tools/setup_cudnn.ps1)
    responsibility: Make the cuDNN SDK available to this CMake build without the NVIDIA Developer Program (which the user corrected is not actually required - see banned/requirements), as the first step toward the still-unimplemented cuDNN-accelerated conv/BN kernels (todo).
    contracts: "Re-checked 2026-10-26 (req-57) that no cuDNN DLLs/headers/libs exist anywhere this build already looks (CUDA Toolkit v12.4 bin/include/lib\\x64, NVIDIA Corporation install path, PATH) - confirmed absent, but NOT blocked on Developer Program credentials as an earlier run wrongly recorded: `pip install nvidia-cudnn-cu12` (no NVIDIA account) provides cuDNN 9.27.0's headers and DLLs. CAVEAT found and worked around: that Windows wheel ships no import library (.lib) - only the official SDK zip does - so MSVC cannot link against it directly. Generated one from the DLL's export table (`dumpbin /exports` on cudnn64_9.dll -> a generated .def listing all 239 exported symbols -> `lib /def:... /out:cudnn.lib /machine:x64`, inside a vcvars64.bat environment) - a standard, lossless technique (the resulting .lib just re-exposes the DLL's real symbols, not a correctness compromise). `native/tools/setup_cudnn.ps1` (tracked, reproducible) automates this: stages the pip wheel's include/bin plus the generated lib/cudnn.lib under `third_party/cudnn/` (gitignored - third-party binaries are never versioned). New CMake option `DETECTOR_CUDNN` (requires `DETECTOR_CUDA=ON`) adds `CUDNN_ROOT` (cache var, defaults to `third_party/cudnn`, overridable to point at an official SDK install instead), finds `cudnn.h`/`cudnn.lib` there, builds the new `native/src/cudnn_backend.cu`/`native/include/detector/cudnn_backend.hpp` (including a handle/version smoke check), and a POST_BUILD step copies `CUDNN_ROOT/bin/*.dll` next to `detector_core`'s output (cuDNN's DLLs are not on system PATH like the CUDA Toolkit's own, unlike `nvrtc64_120_0.dll`/`cublas64_12.dll` which the already-installed CUDA Toolkit v12.4 already provides and cuDNN depends on - no need to vendor those separately). Verified 2026-10-26 in an isolated `build-cudnn/` directory (never touching the `build/` directory or `cuda_detector_train.exe` process the live YOLOv3/Darknet-53 retrain, PID 11848, was using) - configured and built cleanly, the new `detector_cudnn_smoke` CTest (native/tests/cudnn_smoke.cpp) passed (actual GPU call returned version 92700), and the full 16-suite CTest (now 16, up from 15, with this new test) still passes with DETECTOR_CUDNN=ON alongside DETECTOR_CUDA=ON. A first real accelerated kernel followed (2026-10-26): `cudnn_convolution_forward` (cudnn_backend.hpp/cu) ports cuda_backend.cu's single-sample NCHW no-bias `convolution` device kernel (the raw matmul before its multiplier/offset/leaky-activation epilogue, which the caller still applies separately) to `cudnnConvolutionForward` (IMPLICIT_GEMM algorithm, per-call handle/descriptor/workspace - correctness-first, not yet optimized for a hot loop). Verified by a new `cudnn_smoke.cpp` parity case: an independently-reimplemented reference convolution (not reusing cuda_backend.cu's kernel, so this does not just compare cuDNN against itself) on a 2-in/3-out-channel, 3x3-kernel, asymmetric 5x4 image matches cuDNN's output to max abs diff 4.77e-7. With DETECTOR_CUDNN=ON, cuda_backend.cu now dispatches inference convolutions through cached CudnnConvolution descriptors/workspace followed by the existing affine/leaky epilogue. CudaTrainer uses cuDNN batched convolution forward/backward-filter/backward-data and spatial batch-normalization forward/backward while preserving the project's running-stat EMA, optimizer, and CUDA fallback when DETECTOR_CUDNN=OFF. CPU/CUDA parity, resize and distinct-batch tests pass; independent convolution backward direct-sum checks pass; full YOLOv3/Darknet-53 501-image validation is identical to the native CUDA baseline (0.62098 mAP@0.5, 2,853 predictions). A same-seed YOLOv2/Darknet19 320-image batch-8 pilot at lr=0.0001 took 11.4s with batched cuDNN versus 12.8s with cuBLAS; losses were 72.4693/73.1155, so numerical trajectories are close but not identical and this one pilot does not establish a sustained speed advantage. cuDNN stays build-time opt-in; the default cuBLAS path remains available. Re-verified 2026-10-26 (req-61, committing the prior worker's interrupted cuDNN-training-kernel-port + CUDA-recurrent work): `build-cudnn/` must be configured with `-DCMAKE_BUILD_TYPE=Release` explicitly (a bare reconfigure without it silently defaulted to Debug, making `detector_overfit_smoke` take ~18 min instead of its normal ~3-8 min - not a cuDNN regression, a missing build-type flag). With that fixed, the full 18-suite CTest (now 18, up from 16, with `detector_cuda_recurrent_smoke` added since the last cuDNN verification) passes cleanly in Release under DETECTOR_CUDNN=ON+DETECTOR_CUDA=ON. `vcvars64.bat` hangs indefinitely in this agent's bash sessions (no output after 5+ minutes, confirmed twice) - MSVC/CUDA builds here must instead export INCLUDE/LIB directly (literal backslash/semicolon values) and prepend MSVC/SDK bin dirs to PATH in MSYS forward-slash/colon form (letting bash's own PATH-to-native translation handle the child-process env block) rather than invoking vcvars64.bat or setting a raw semicolon-joined PATH (the latter corrupts the env block for native child processes in this MSYS bash - `where.exe`/`cmd.exe` then report PATH as not set). This recipe is recorded in `.agent-work/build_env.sh` (gitignored, regenerate by inspecting this note if lost) for reuse by future sessions on this machine."
  - component: native/src/network.cpp and native/src/cuda_backend.cu
    responsibility: Config-driven graph and CPU/CUDA inference for convolution, max-pooling, dense, route, upsample, YOLO heads and terminal softmax; load/save supported Darknet-format weights.
    contracts: The graph supports YOLOv3-tiny inference plus shortcut (residual-add) layers for CPU and CUDA (2026-10-01, `native/tests/shortcut.cfg` regression test), which is the layer needed to parse full YOLOv3/Darknet-53 configs; those full configs are still unvalidated end-to-end. Dropout (inverted dropout, no-op at inference) and reorg (YOLOv2-style space-to-depth, this project's own independently-derived channel/spatial convention - a bijection, so any consistent mapping is correct for training, but not guaranteed to match original Darknet's exact interleaving for loading a pretrained YOLOv2 backbone) layers were added 2026-10-12 (req-32) to CPU/CUDA inference (network.cpp/cuda_backend.cu) and CPU/CUDA training (training.cpp/cuda_training.cu, including CudaTrainer's forward/backward dispatch, device buffer allocation and the Darknet-multiscale resize path) - verified by CPU/CUDA inference parity and an exact hand-derived space-to-depth mapping check (native/tests/smoke.cpp, reorg.cfg/dropout.cfg), a CPU Trainer loss-decreases regression (training_smoke.cpp, reorg-train.cfg/dropout-train.cfg), and a CPU/CUDA training parity case for reorg plus a CUDA-only finite-loss/weights-update sanity check for dropout (cuda_training_smoke.cpp - dropout's mask RNG differs CPU vs GPU by design, so exact parity does not apply to it). All 15 CTest suites pass. `Network::load_weights(path, layer_limit)` (2026-10-07, req-16 'b') adds Darknet `partial N` semantics - `layer_limit < 0` (default) is the original strict full-file load (rejects trailing data); `layer_limit >= 0` reads only layers `[0, layer_limit)` from `path` and returns without the trailing-data check, so a larger/differently-headed source file (e.g. the official COCO yolov3-tiny.weights) can seed a matching-shape backbone prefix while later shape-diverging layers are left at whatever `initialize_random()` set. `train_main.cpp`'s new `--init-layers N` (requires `--init`) drives this - it always calls `initialize_random(seed)` first, then overlays `[0, N)` from the init file. Verified by `native/tests/smoke.cpp`'s partial-load case (layer 0 loaded from file, layer 2 left at its pre-call random value; a full load of the same file plus one trailing byte is rejected) and an end-to-end CLI smoke run loading the real 15-layer COCO backbone into `yolov3-tiny-voc.cfg`. `[region]` (Darknet's region_layer.c, YOLOv2's detection head - req-31/req-35 investigation, 2026-10-13) was added as `Kind::region` to CPU/CUDA inference (network.cpp's layer_output_shape/cfg parser/decode, cuda_backend.cu's existing generic pass-through) and CPU/CUDA training (training.cpp's backward pass-through, cuda_training.cu's allow-list/host-loss-call/backward dispatch - all widened from `Kind::yolo` to `Kind::yolo || Kind::region`, reusing the identical forward/backward pass-through code paths unchanged). Unlike `[yolo]`, every `anchors` entry applies to every cell (`mask` is populated as the identity [0..num) by the cfg parser, so the shared yolo/region assignment code in yolo_loss.cpp treats both kinds uniformly with no mask-specific branching), class loss is softmax+cross-entropy instead of independent per-class BCE, objectness is weighted by cfg `object_scale`/`noobject_scale` (new Layer fields, default 1 - neutral for yolo layers, which never set them) and can be rescored to the predicted box's IoU with its matched truth instead of a flat 1 (`rescore`), and box coordinate loss additionally folds in `coord_scale` (also default 1). Darknet's rarely-used position-aware `bias_match=0` variant, `absolute`, and `random`/`jitter` (superseded by this project's own `--multiscale`/`--*-jitter` CLI flags) are parsed-and-ignored simplifications - not supported; this project's region layer always takes Darknet's `softmax=1` branch (the independent-logistic `softmax=0` variant is not supported). ONNX export and TensorRT inference remain YOLOv3-tiny-specific (trt_session.cpp hardcodes exactly two `yolo` heads) - region/YOLOv2 has native CPU/CUDA training and inference only, no TensorRT path yet. Verified by a hand-computed softmax-decode case in smoke.cpp (region.cfg, 2 anchors/2 classes - asserts decode()'s score equals objectness*softmax(class), not objectness*sigmoid(class), plus CPU/CUDA forward parity), a CPU Trainer loss-decreases regression (training_smoke.cpp, region-train.cfg exercising softmax class loss/rescore/scale knobs), and a CPU/CUDA training parity case (cuda_training_smoke.cpp - region has no learnable parameters or randomness, so it fits the exact parity harness like reorg, matching to ~1e-7). All 15 CTest suites pass. BUG FOUND AND FIXED while assembling a real YOLOv2 cfg (2026-10-13, req-31/req-37) - `layer_output_shape`'s `Kind::route` case validated every concatenated branch's spatial shape against the incoming sequential `shape` parameter (the immediately-preceding layer's output) instead of against each other - this silently worked for every route pattern this project had exercised so far (YOLOv3-tiny's `route layers=-4` and `route layers=-1,8`, mini.cfg's `route layers=-1,0`) only because one of those cfgs' route sources always happened to equal the preceding layer's shape, but it incorrectly rejected a standalone passthrough route (Darknet's standard YOLOv2 `[route] layers=-9`, jumping back to an earlier layer at a different spatial resolution than the layer immediately before the route) with "route spatial shapes differ". Fixed by comparing every source branch's shape to the first branch's shape instead of to `shape` (route's output shape is now the first branch's shape, matching Darknet's actual route semantics - a route layer's output never depends on what came immediately before it, only on its listed sources). Verified by a new regression test (native/tests/smoke.cpp, route-passthrough.cfg - a lone `route layers=-2` resolving to a pre-maxpool 4x4 layer, which differs from the route's immediately-preceding maxpool's 2x2 output); all 15 CTest suites still pass.
  - component: "native/src/recurrent.cpp (RecurrentCell: RNN/LSTM/GRU)"
    responsibility: Standalone recurrent cell with CPU forward+BPTT for all three kinds Darknet exposes (rnn/lstm/gru), independently derived from the standard recurrence equations (not ported from Darknet's rnn_layer.c/lstm_layer.c/gru_layer.c).
    contracts: "Added 2026-10-26 (req-32/53, user chose (a) all three kinds in one pass, (b) no end-to-end toy-sequence demo/cfg integration needed for now). `RecurrentCell(kind, input_size, hidden_size, seed)` holds its own weight matrices (per-gate Wx/Wh/b: 1 gate for rnn, 3 for gru (z/r/n, Cho formulation - n's hidden-recurrence term multiplies r_t*h_{t-1}, not h_{t-1} directly), 4 for lstm (i/f/o/g, standard gating with c_t = f*c_prev + i*g, h_t = o*tanh(c_t))) and persists h_ (and c_ for lstm) across `step()` calls within a sequence; `reset_sequence()` zeros state and the timestep cache between independent sequences. `backward_through_time(dh_targets)` runs standard BPTT in reverse timestep order, carrying dh/dc contributions from each timestep's h_{t-1}/c_{t-1} dependency back to the previous timestep, accumulating into per-gate gradient buffers (`zero_gradients()`/`sgd_step(lr)` - plain SGD only, no momentum/decay, a narrower scope than Trainer/CudaTrainer) and returning dLoss/dInput per timestep. Verified by `native/tests/recurrent_smoke.cpp`: a central finite-difference gradient check (eps=1e-3, every 5th of each kind's flattened parameters, 3-timestep sequence, loss=sum of h_t^2) gives max relative error 4.2e-5 (rnn), 1.5e-4 (lstm), 2.6e-4 (gru) - all comfortably under the test's 0.02 threshold; and a 200-step loss-decreases regression (4-timestep fixed synthetic sequence, target the last timestep's hidden state at 1, elsewhere 0) for each kind, confirming the accumulated gradients and sgd_step actually reduce loss, not just satisfy the gradient check in isolation. A CUDA sequence forward/BPTT runner (cuda_recurrent.cu) executes all three kinds from zero or supplied initial hidden/cell state and returns per-timestep outputs/input gradients plus flattened parameter gradients; native/tests/cuda_recurrent_smoke.cpp checks every output and gradient against RecurrentCell within 2e-4 scale-aware tolerance, including distinct timesteps and a repeated-run determinism check. Wired into Network/ClassificationTrainer as cfg layer kinds 2026-10-26 (req-32/61/62/63) - `Kind::rnn/lstm/gru` (network.hpp/cpp), cfg `[rnn]`/`[lstm]`/`[gru]` sections with `output=N` (reusing `Layer::filters` for hidden size, the same field connected layers already use for their output count). Design decision: one `Network::forward()`/`classify()` call is one timestep, with the layer's hidden (and lstm cell) state persisting across calls in a new `mutable std::vector<std::optional<RecurrentCell>> Network::cells_` member (mirrors this project's BN running-stat persistence, not reset on every call) rather than threading a batched time dimension through every other layer kind, which this project's single-pass-per-sample graph has no axis for; `Network::reset_sequence()` explicitly starts a new independent sequence. `cells_` is lazily constructed by `initialize_random()`/`load_weights()` (matching how convolutional/connected start with empty weights/biases) and serialized through `RecurrentCell::parameter_values()`/`parameters()` in `save_weights()`/`load_weights()`; `resize()` throws for a cfg combining multiscale resizing with a recurrent layer (input_size is fixed at construction, the two features were never meant to combine). The detector `Trainer`/`CudaTrainer` explicitly reject rnn/lstm/gru layers (clear error, pointing at `ClassificationTrainer`) since Darknet's own rnn.c pairs these with a classification head, not a YOLO detector. `ClassificationTrainer` gained `train_sequence(inputs, class_ids)` - trains one chunk of `inputs.size()` consecutive timesteps via truncated BPTT (Darknet rnn.c's `time_steps`-per-batch pattern): every other layer kind's weight gradient is summed across the chunk into one averaged SGD update (matching `Trainer::step()`'s minibatch averaging), the recurrent layer gets exactly one `backward_through_time()` call over the whole chunk then its own `sgd_step()`. This required one small `RecurrentCell::backward_through_time()` behavior addition - it now clears the cached chunk (but not h_/c_) on return, so the next `step()` starts a fresh chunk while still carrying hidden/cell state forward, enabling chunked training over an arbitrarily long sequence instead of requiring the whole thing cached for one backward call; the existing single-chunk-per-sequence tests in `recurrent_smoke.cpp`/`cuda_recurrent_smoke.cpp` already called `reset_sequence()` before each chunk and so were unaffected. `Network::cell_at(index)` (public, mutable-through-const) lets the free `cpu_forward()` function advance a cell's state despite `Network::forward()` being `const`. The CUDA inference backend now dispatches recurrent layers through the CUDA sequence runner and synchronizes hidden/cell state with Network::reset_sequence(); CudaClassificationTrainer::train_sequence runs full truncated BPTT with CUDA convolution/maxpool/dense layers around one recurrent layer, averaging their SGD updates across the chunk while matching the CPU recurrent cell's unaveraged parameter update. CudaTrainer explicitly directs recurrent classifier cfgs to CudaClassificationTrainer. Verified by `native/tests/classifier_smoke.cpp`'s new `exercise_sequence()` (`rnn-classifier.cfg`/`lstm-classifier.cfg`/`gru-classifier.cfg`, each `[rnn|lstm|gru] output=4` -> `[connected] output=2` -> `[softmax]`) - a length-4 one-hot token sequence classified by its FIRST token, unsolvable without the recurrent layer actually carrying hidden state across timesteps (tokens at t>0 are i.i.d. random); all three kinds converge (rnn/lstm in 400 sequences, gru needed 800 - slower but not buggy, confirmed by a standalone 2000-sequence debug run showing gru's loss keeps falling past 400) and a save/load checkpoint round trip reproduces the identical per-timestep classification after `reset_sequence()`. All 17 (DETECTOR_CUDA) / 18 (DETECTOR_CUDNN, Release) CTest suites pass. CUDA classifier parity now covers all three recurrent kinds over two consecutive chunks, stateful CPU/CUDA inference, and a convolution/maxpool prefix (2026-10-27)."
