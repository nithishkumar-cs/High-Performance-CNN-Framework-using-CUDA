project:
  purpose: Independently written, reusable C++/CUDA neural-network framework inspired by Darknet, supporting configurable training and inference across models, with Jetson inference as a deployment target.
  current_state: The native C++/CUDA framework and original CUDA CNN are committed. CUDA detector training has CPU/GPU parity verified to ~1e-6; native CPU/CUDA inference, classifier SGD, and true-minibatch detector training work. The 71-epoch, 320,210-image laptop GPU retrain of YOLOv3-tiny VOC2007 with the official COCO-pretrained first 15 layers finished 2026-10-08. Its final native-trained checkpoint scored 0.25712 mAP@0.5 on all 501 validation images (1,305 non-difficult objects); the historical external-Darknet checkpoint scored 0.57612 using the same evaluator, PPM images and thresholds. Pretrained native training therefore moved mAP well off the near-zero floor, but remains far below the external baseline; native training from scratch has not produced a useful detector, and the new native checkpoint has not been evaluated on the held-out test split. Laptop Docker training is documented but its image build/GPU training run remain unverified. A 2026-10-08 audit found that this full run scaled each unmatched YOLO objectness gradient by 0.5/2535; original Darknet uses a unit per-candidate delta. The shared native CPU/CUDA loss has been corrected and passes smoke/parity/overfit checks, but short fine-tuning of the old checkpoint with the changed objective reduced mAP; its effect in a fresh full-budget run remains unverified. This fix (yolo_loss.cpp/.hpp, a training_smoke.cpp regression test, and matching docs/DESIGN edits) was left uncommitted by an interrupted session; rebuilt, retested and committed 2026-10-08. The user then chose to close two more named Darknet-fidelity gaps before retraining - SGD momentum=0.9 (Trainer/CudaTrainer, new velocity buffers, CPU/GPU parity-tested) and the `(2 - truth.w*truth.h)` box scale on matched coordinate loss, plus removing the non-Darknet per-target loss/gradient normalization (all 2026-10-08, req-22); momentum, box scale and normalization are now all closed; multiscale/resize-jitter training (the last named fidelity gap) was closed 2026-10-12 - see the yolo_loss.cpp/training.cpp architecture entry below. All three new changes passed the full CTest suite including overfit_smoke (after rescaling that test's and cuda_training_smoke's LRs down for momentum's ~10x effective step-size increase - see yolo_loss.cpp and training.cpp component entries). A fresh full-budget GPU retrain (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, same COCO-backbone-init/71-epoch/320,210-image recipe as the prior run) combining all of these fixes finished 2026-10-09 08:08 local (mean_loss=9.41512). Evaluated 2026-10-11 on the same 501 validation images/1,305 non-difficult objects, same evaluator settings (confidence 0.01, class-aware NMS IoU 0.45), giving mAP@0.5=0.59801, with only 3,380 total predictions (vs 14.2M for the pre-momentum/box-scale/normalization checkpoint and 14,245,633 for the first pretrained-backbone checkpoint). This is a decisive jump from 0.25712 to 0.59801 - now slightly ABOVE the historical external-Darknet baseline (0.57612) on the same evaluator/data. The combined momentum=0.9 + box-scale-by-area + no-per-target-normalization + corrected background-objectness-weight fixes were therefore the dominant cause of the prior gap, not training budget or multiscale/resize-jitter (the one remaining named fidelity gap, now lower priority). Evaluated 2026-10-12 on the held-out VOC2007 test split (4,952 images, 12,032 non-difficult objects; JPEGs converted to runs/ppm/test via jpg_to_ppm.py), same evaluator settings (confidence 0.01, class-aware NMS IoU 0.45) - mAP@0.5=0.58182, 31,667 predictions - above the historical external-Darknet test baseline (0.55534) and consistent with the 0.59801 validation score, confirming this checkpoint generalizes. This checkpoint (runs/yolov3-tiny-voc-pretrained-full-budget-corrected.weights) was deployed and evaluated on the Jetson Orin 2026-10-12 (see 'Jetson deployment of the corrected checkpoint' architecture entry below) - native CUDA, TensorRT FP32 and TensorRT FP16 all land within noise of the laptop's native-CUDA scores (around 0.600 val / 0.581 test mAP@0.5) and of the historical checkpoint's Jetson inference speed, so it is now the selected deployment checkpoint. Dropout and reorg layers (CPU+CUDA inference and training) were added and verified 2026-10-12 (req-32), closing two of the three previously-unimplemented upstream Darknet layer types. The third, RNN-family (RNN/LSTM/GRU), has CPU and CUDA standalone sequence forward/BPTT implementations (gradient-checked, CPU/CUDA parity-verified) AND is now wired into Network/ClassificationTrainer as real `[rnn]`/`[lstm]`/`[gru]` cfg layer kinds with one-call-per-timestep framing and truncated-BPTT chunk training (2026-10-26, req-32/61/62/63) - see the RecurrentCell architecture entry; CUDA inference and classifier sequence training now use the recurrent CUDA runner, with persistent state and CPU/CUDA parity across chunks (2026-10-27); the detector trainers still reject recurrent classifier graphs. The 71-epoch/320,210-image full-budget YOLOv2/Darknet19 VOC2007 retrain (runs/yolov2-voc-pretrained-full-budget.weights, pretrained Darknet19 first-23-layer backbone, batch 16, momentum 0.9, same jitter recipe as YOLOv3-tiny) finished 2026-10-22 16:31 local (mean_loss=13.5013) after the cuBLAS/im2col and batched-BN-reduction speed fix (see 'Native CUDA detector training performance' architecture entry); no process was still running as of the 2026-10-25 check. Evaluated 2026-10-25 with the same native CUDA evaluator settings as the YOLOv3-tiny checkpoints (confidence 0.01, class-aware NMS IoU 0.45) after rebuilding cuda_detector_eval.exe against the already-fixed route-shape library (the committed binary predated that fix and errored "route spatial shapes differ" until relinked) scored mAP@0.5=0.56054 on the same 501 validation images/1,305 non-difficult objects (5,847 predictions), and mAP@0.5=0.57215 on the full VOC2007 test split (4,952 images, 12,032 non-difficult objects, 54,896 predictions) - logs .agent-work/yolov2_full_budget_val_eval.log and .agent-work/yolov2_full_budget_test_eval.log. This is a working, generalizing YOLOv2/Darknet19 detector from this project's second architecture, close to but slightly below the corrected YOLOv3-tiny checkpoint (0.59801 val / 0.58182 test) - no external-Darknet YOLOv2 baseline has been run for a same-evaluator comparison, so this is evidence of a working second architecture, not a head-to-head fidelity claim against original Darknet's own YOLOv2. The full 71-epoch/320,210-image YOLOv3/Darknet-53 retrain (third architecture, full 106-layer graph with 3 detection scales, not just -tiny) finished 2026-10-26 and evaluated at mAP@0.5=0.62098 val / 0.61593 test - the best of all three native architectures trained so far (see 'Full YOLOv3/Darknet-53 end-to-end validation' architecture entry). 2026-10-27 - CPU/CUDA RNN/LSTM/GRU Network/Trainer wiring and sequence training were finished and committed (`145a71a`, closing req-32/61/62/63 fully, including the CUDA recurrent path left pending by the prior session). Multi-GPU detector training was added (`--gpus`, weight/momentum/BN state sync across devices, commit `bc7de21`) - the CUDA suite passed 18/18 and three focused cuDNN checks passed; a real multi-GPU throughput measurement remains unverified because this laptop has only one GPU. Framework/deployment docs were corrected for staleness (`d688600`). A deeper native CUDA CNN was trained on MNIST reaching 98.49% held-out accuracy with matching CPU/CUDA results (`a56de6a`). Global `[avgpool]` plus `[l2norm]` committed (`b33dae8`, 19/19 CTest in CUDA Release). `[local]`, `[deconvolutional]` and `[normalization]` (CPU/CUDA inference and training, gradient-checked, CPU/CUDA parity-verified) committed `8c4e2f8`, closing every niche layer kind; only the example apps remain (req-67/68). Added the CIFAR-10 classifier example app (`cuda_cifar`, commit `7ed61db`) - reuses `ClassificationTrainer`/`CudaClassificationTrainer` unchanged, only a new CIFAR-10 binary dataset loader/CLI; 20/20 CTest passes. Added `regressor` (MSE) and `tag` (multi-label sigmoid-BCE) example apps (req-79) via a new `VectorTrainer` class (`native/src/vector_trainer.cpp`) - a deliberate duplicate of `ClassificationTrainer::step()`'s forward/backward loop (not a shared refactor, to avoid risking that already parity-tested code path) with a different final loss/gradient. Required loosening `Network::from_cfg`'s head-kind check to also accept a cfg ending in a plain feedforward layer (connected/convolutional/local/deconvolutional/avgpool/l2norm/normalization), and extending `cpu_forward` to push a `Head` for such a terminal layer too (previously only `[softmax]`/`[yolo]`/`[region]` produced one) so `Network::forward()` can retrieve the raw prediction for eval. New `cuda_regressor`/`cuda_tag` CLIs read this project's own fixed-record binary dataset format (`VectorDataset`, no upstream equivalent - Darknet's own regressor.c/tag.c need OpenCV for a JPEG directory, which this build lacks). CPU-only for this pass (no CUDA VectorTrainer yet). Verified by a new `vector_dataset_smoke` test, a `classifier_smoke.cpp` loss-decreasing+convergence case for each loss kind, and a synthetic CLI train+eval run for each app; 21/21 CTest passes. Confirmed 2026-10-29 (req-71) - the project is resume-ready as a from-scratch C++/CUDA framework with three working, generalizing detector architectures (YOLOv3-tiny/YOLOv2/full YOLOv3-Darknet53, each at or above external-Darknet's same-evaluator mAP@0.5) and Jetson deployment (native CUDA + TensorRT FP32/FP16) complete for all three, not just the first. On 2026-10-29 the relevant segmentation example apps were added, including semantic pixelwise softmax-CE with void-label handling and a separate class-agnostic instance ROI mask head paired with the existing detector; VOC2007 packers produced 209 semantic and 633 instance training records at 32x32. Synthetic convergence, CPU/CUDA mask inference and CPU/CUDA training parity pass; CUDA segmentation training and real VOC runs were done 2026-10-29 (semantic val mIoU 0.060 on the tiny 209-image split, mask head val GT-crop IoU 0.468); ONNX/TensorRT mask export and Jetson mask benchmarking remain open. The user selected native-darknet-cuda as the repository name; README title reflects it, but GitHub rename is pending admin authentication.

requirements:
  - requirement: Build on the user's original CUDA CNN repository and keep its Git history; implement a trainable multi-model framework, not only a YOLOv3-tiny application.
  - requirement: Train future models on this laptop's RTX 3070 Ti; use the Jetson Orin for inference and evaluation only. The older Jetson-trained checkpoint remains a historical baseline.
  - requirement: Implement the framework independently without forking or copying Darknet source. Compatibility is limited to the supported config layers and Darknet-format weights; unsupported layers fail explicitly.
  - requirement: Preserve native CPU/CUDA inference and Jetson deployment. ONNX export and TensorRT inference are optional paths for the same trained weights, not prerequisites for native inference.
  - requirement: Evaluate comparable models and report dataset, checkpoint origin, metric definition and timing scope. The VOC AP@0.5 values use converted labels without difficult objects and are not official VOC or COCO leaderboard scores.
  - requirement: Run long jobs without opening visible extra terminals.
banned:
