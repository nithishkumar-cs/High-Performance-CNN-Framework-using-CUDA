project:
  purpose: Independently written, reusable C++/CUDA neural-network framework inspired by Darknet, supporting configurable training and inference across models, with Jetson inference as a deployment target.
  current_state: The native C++/CUDA framework and original CUDA CNN are committed. CUDA detector training has CPU/GPU parity verified to ~1e-6; native CPU/CUDA inference, classifier SGD, and true-minibatch detector training work. The 71-epoch, 320,210-image laptop GPU retrain of YOLOv3-tiny VOC2007 with the official COCO-pretrained first 15 layers finished 2026-10-08. Its final native-trained checkpoint scored 0.25712 mAP@0.5 on all 501 validation images (1,305 non-difficult objects); the historical external-Darknet checkpoint scored 0.57612 using the same evaluator, PPM images and thresholds. Pretrained native training therefore moved mAP well off the near-zero floor, but remains far below the external baseline; native training from scratch has not produced a useful detector, and the new native checkpoint has not been evaluated on the held-out test split. Laptop Docker training is documented but its image build/GPU training run remain unverified. A 2026-10-08 audit found that this full run scaled each unmatched YOLO objectness gradient by 0.5/2535; original Darknet uses a unit per-candidate delta. The shared native CPU/CUDA loss has been corrected and passes smoke/parity/overfit checks, but short fine-tuning of the old checkpoint with the changed objective reduced mAP; its effect in a fresh full-budget run remains unverified. This fix (yolo_loss.cpp/.hpp, a training_smoke.cpp regression test, and matching docs/DESIGN edits) was left uncommitted by an interrupted session; rebuilt, retested and committed 2026-10-08. The user then chose to close two more named Darknet-fidelity gaps before retraining - SGD momentum=0.9 (Trainer/CudaTrainer, new velocity buffers, CPU/GPU parity-tested) and the `(2 - truth.w*truth.h)` box scale on matched coordinate loss, plus removing the non-Darknet per-target loss/gradient normalization (all 2026-10-08, req-22); momentum, box scale and normalization are now all closed, and only multiscale/resize-jitter training remains open. All three new changes passed the full CTest suite including overfit_smoke (after rescaling that test's and cuda_training_smoke's LRs down for momentum's ~10x effective step-size increase - see yolo_loss.cpp and training.cpp component entries). A fresh full-budget GPU retrain (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, same COCO-backbone-init/71-epoch/320,210-image recipe as the prior run) combining all of these fixes finished 2026-10-09 08:08 local (mean_loss=9.41512). Evaluated 2026-10-11 on the same 501 validation images/1,305 non-difficult objects, same evaluator settings (confidence 0.01, class-aware NMS IoU 0.45), giving mAP@0.5=0.59801, with only 3,380 total predictions (vs 14.2M for the pre-momentum/box-scale/normalization checkpoint and 14,245,633 for the first pretrained-backbone checkpoint). This is a decisive jump from 0.25712 to 0.59801 - now slightly ABOVE the historical external-Darknet baseline (0.57612) on the same evaluator/data. The combined momentum=0.9 + box-scale-by-area + no-per-target-normalization + corrected background-objectness-weight fixes were therefore the dominant cause of the prior gap, not training budget or multiscale/resize-jitter (the one remaining named fidelity gap, now lower priority). The native checkpoint has not yet been evaluated on the held-out test split; that is the next step before calling this the selected checkpoint.

requirements:
  - requirement: Build on the user's original CUDA CNN repository and keep its Git history; implement a trainable multi-model framework, not only a YOLOv3-tiny application.
  - requirement: Train future models on this laptop's RTX 3070 Ti; use the Jetson Orin for inference and evaluation only. The older Jetson-trained checkpoint remains a historical baseline.
  - requirement: Implement the framework independently without forking or copying Darknet source. Compatibility is limited to the supported config layers and Darknet-format weights; unsupported layers fail explicitly.
  - requirement: Preserve native CPU/CUDA inference and Jetson deployment. ONNX export and TensorRT inference are optional paths for the same trained weights, not prerequisites for native inference.
  - requirement: Evaluate comparable models and report dataset, checkpoint origin, metric definition and timing scope. The VOC AP@0.5 values use converted labels without difficult objects and are not official VOC or COCO leaderboard scores.
  - requirement: Run long jobs without opening visible extra terminals.
banned:
  - item: Treat YOLOv3-tiny inference or weights trained by original Darknet as proof that this framework can train a useful detector.
    reason: The user asked for a trainable C/CUDA framework; external-Darknet weights alone are not evidence of native training. The corrected native pretrained-backbone run now reaches 0.59801 validation mAP, above the external-Darknet baseline (0.57612), while from-scratch runs remain near zero.
  - item: Use Jetson for future training runs.
    reason: The user chose laptop-only training and Jetson-only inference.
  - item: Reintroduce unrelated PyTorch/Ultralytics implementation as the project core or compare YOLOv8n as if it were the same Darknet model.
    reason: The user corrected that scope; Ultralytics may be used only for a genuinely comparable baseline.
  - item: Fabricate, backdate, or auto-generate (e.g. via an activity-generator tool) commit dates/history to make the work look older or predate this assistance.
    reason: The user asked for spread-out weekend-dated commits going back a year; the assistant refused and the user accepted an honest history going forward instead (commits may still note a genuine, evidence-backed approximate prior timeline in prose, not in commit dates).
architecture:
  - component: Git remote and Jetson deployment environment
    responsibility: Source control for this repo and the remote target used for inference/deployment benchmarking (never training).
    contracts: "GitHub origin `nithishkumar-cs/High-Performance-CNN-Framework-using-CUDA`, commits authored as `Nithish Kumar <nithishk.cs@gmail.com>`; pushes to `main` need the user's explicit approval each time (sandbox auto-review blocks unapproved pushes). Jetson reachable via SSH alias `jetson-ts` (also `jetson`): a Jetson Orin Nano Super on JetPack R36.5 with TensorRT 10.3; benchmarks default to the board's 25W mode unless stated otherwise."
  - component: Root CMakeLists.txt, original CUDA CNN, and native CLI programs
    responsibility: Build the newer detector_core C++17 library and detector/classifier inspect, train, evaluate and benchmark executables while retaining the original fixed-shape MNIST CUDA CNN as project history.
    contracts: "CMake options DETECTOR_CUDA, DETECTOR_OPENCV and DETECTOR_TENSORRT select optional backends; TensorRT requires CUDA. Both the restored original CNN files and the full native/ framework (CMakeLists.txt included) are committed. Local CUDA build/test invocation on this Windows laptop (plain cmake/ninja/ctest are not on PATH) - run 'C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Auxiliary\\Build\\vcvars64.bat', then use the MSVC-bundled cmake.exe/ninja.exe/ctest.exe under '...\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin' and '...\\CMake\\Ninja', configuring with -DDETECTOR_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 -G Ninja. Running an already-built native exe (e.g. cuda_detector_train.exe) needs none of this - only configuring/building does; a vcvars64.bat call in a launch script is unnecessary and risks failing on its own (e.g. a missing vswhere.exe) before the program even starts, as happened to an interrupted long-retrain launch attempt on 2026-10-06 whose log never reached the program's own startup line."
  - component: native/src/network.cpp and native/src/cuda_backend.cu
    responsibility: Config-driven graph and CPU/CUDA inference for convolution, max-pooling, dense, route, upsample, YOLO heads and terminal softmax; load/save supported Darknet-format weights.
    contracts: The graph supports YOLOv3-tiny inference plus shortcut (residual-add) layers for CPU and CUDA (2026-10-01, `native/tests/shortcut.cfg` regression test), which is the layer needed to parse full YOLOv3/Darknet-53 configs; those full configs are still unvalidated end-to-end. Dropout, reorg and RNN-family layers from upstream Darknet remain unimplemented (low priority, not requested). `Network::load_weights(path, layer_limit)` (2026-10-07, req-16 'b') adds Darknet `partial N` semantics - `layer_limit < 0` (default) is the original strict full-file load (rejects trailing data); `layer_limit >= 0` reads only layers `[0, layer_limit)` from `path` and returns without the trailing-data check, so a larger/differently-headed source file (e.g. the official COCO yolov3-tiny.weights) can seed a matching-shape backbone prefix while later shape-diverging layers are left at whatever `initialize_random()` set. `train_main.cpp`'s new `--init-layers N` (requires `--init`) drives this - it always calls `initialize_random(seed)` first, then overlays `[0, N)` from the init file. Verified by `native/tests/smoke.cpp`'s partial-load case (layer 0 loaded from file, layer 2 left at its pre-call random value; a full load of the same file plus one trailing byte is rejected) and an end-to-end CLI smoke run loading the real 15-layer COCO backbone into `yolov3-tiny-voc.cfg`.
  - component: native/src/classifier_trainer.cpp and native/src/cuda_classifier_trainer.cu
    responsibility: CPU/CUDA single-sample SGD for sequential linear, MLP and small CNN classifiers with softmax/cross-entropy; IDX/MNIST CLI and examples.
    contracts: CUDA trainer lacks branched-graph backprop and trainable batch normalization; full MNIST Jetson runs reached 97.24% test accuracy for the MLP and 97.27% for the small CNN.
  - component: native/src/cuda_training.cu, native/include/detector/cuda_trainer.hpp, native/src/yolo_loss.cpp/native/include/detector/yolo_loss.hpp
    responsibility: CUDA/GPU training backend for the detector graph (CudaTrainer), mirroring the CPU Trainer - conv/batch-norm/shortcut/route/upsample/maxpool forward+backward as CUDA kernels, true-batch SGD (one step() call takes the whole minibatch and applies one update), the same LearningRateSchedule; the YOLO anchor-assignment/loss is factored into shared yolo_loss.cpp/hpp so CPU and GPU use identical loss math. train_main.cpp's `--backend cpu|cuda` selects it; `--backend cuda` requires -DDETECTOR_CUDA=ON. Device buffers are sized for `batch_size` sample-major blocks; step() accepts between 1 and `batch_size` samples (a smaller final partial batch is fine).
    contracts: "Verified by a CPU/GPU parity test (native/tests/cuda_training_smoke.cpp, registered under DETECTOR_CUDA) that trains matched-seed CPU and GPU copies of the same cfg for several steps and asserts every weight/bias/scale/mean/variance matches within tight relative tolerance - passing with ~1e-6 max diff (2026-10-05) across a batch-normalized 5-step case and two shortcut-layer cases (plain and with minibatching). A real bug was found and fixed this way - the batch_norm_apply and batch_norm_backward_dz kernels were missing their thread bounds check ('if (pos >= count) return;'), so overhang threads from the rounded-up launch grid wrote past buffer ends and corrupted other device buffers (caught via a weight diverging to ~0 vs the CPU's real value after one step); fixed by adding the bounds check and the missing count/elements argument at both call sites. No multi-GPU path (project trains on one laptop GPU by requirement). GPU retrain on the 64x64 toy voc-smoke.cfg (2026-10-05, 20 epochs/90,240 images at batch 8, ~15 min on the RTX 3070 Ti) and a second retrain on the REAL yolov3-tiny-voc.cfg at 416x416 (2026-10-05, 3 epochs/13,530 images at batch 8, ~46 min, ~175 ms/image) both converged loss cleanly (16.34->5.52 and 10.07->5.39 respectively) but left validation mAP@0.5 at ~0.002 either way. CORRECTED ANALYSIS (superseding this entry's earlier same-day claim that this 'rules out undertraining'): that claim compared this trainer's minibatch COUNT (batch=8) against the historical run's batch COUNT (10,000), but the historical Darknet run used batch=32 per step, i.e. ~320,000 images total - both GPU retrains above (90,240 and 13,530 images) are actually 3.5x and ~24x UNDER that proven budget, not over it. A full line-by-line audit of yolo_loss.cpp's anchor-assignment/encode and network.cpp's decode (which is independently validated by the historical checkpoint's 0.57 mAP through this same decode/metrics code) found them mathematically symmetric and consistent, as is the duplicated training-time forward pass in training.cpp against network.cpp's inference forward (same conv/maxpool/BN formulas) - no clear correctness bug surfaced. Known, already-documented simplifications remain (no Darknet-style ignore_thresh for near-miss anchors, per-sample not true-batch BN statistics, brightness-only jitter) that could slow convergence relative to full Darknet fidelity. FOLLOW-UP (2026-10-05, native/tests/overfit_smoke.cpp, req-14): the line-by-line audit above was necessary but not sufficient proof, so this adds a decisive dynamic check - overfitting fixed, noise-free synthetic examples for thousands of CPU steps removes the capacity/budget/dataset-noise variables entirely. Two scenarios both converge to score>0.999 and IoU>0.83 against their ground-truth box: (1) mini.cfg, one head, one anchor, one class, one target; (2) voc-smoke.cfg itself (the actual two-head/multi-anchor/20-class architecture used by the failing retrains), two targets of different classes/scales that the anchor-IoU logic must route to different heads and cells. This is decisive: the anchor-assignment/loss-encode/backward/decode round trip CAN learn correct, confident localization from scratch when the example is trivial, which rules out a hard correctness bug in that machinery as the cause of the near-zero mAP. The remaining gap is therefore most likely the proven ~15h+/320,000-image training budget not yet being met, and/or real-VOC-specific difficulty (class imbalance across 20 classes, multiple/ambiguous objects per image, no ignore_thresh, weaker augmentation than Darknet) rather than a hidden bug in this tested machinery - see todo for the next decision. FOLLOW-UP 2 (2026-10-05, req-15 'b first'): added ignore_thresh (Darknet near-miss suppression - a predicted box already overlapping a target by >= the cfg's ignore_thresh, default 0.7, skips objectness-negative loss; Layer::ignore_thresh, parsed in network.cpp, applied in the shared yolo_loss.cpp so both CPU and GPU trainers get it for free) plus full crop/HSV training augmentation (see training.cpp entry below), then re-ran the exact same 64x64 voc-smoke.cfg/20-epoch/90,240-image GPU retrain for a controlled comparison: mAP@0.5 = 0.00118, i.e. NOT meaningfully different from the pre-fidelity 0.00196/~0.002 baselines. This is a second piece of evidence (after the overfit_smoke correctness proof) against 'missing fidelity' as the dominant cause at this budget - reinforcing that the ~15h+/320,000-image training budget gap is still the leading explanation. True-batch BN statistics (the third named fidelity item) was deliberately NOT attempted this run: it requires restructuring both Trainer and CudaTrainer from single-sample forward+immediate-backward into a two-pass batched design (a stats pass over the whole minibatch, then a train pass normalizing with those stats), which is invasive enough to risk the parity-tested CUDA trainer and warrants its own dedicated session with new gradient-check tests, not a drive-by change. FOLLOW-UP 3 (2026-10-06, req-16 'b'): implemented true-batch BN statistics for real - both Trainer::step and CudaTrainer::step now take a minibatch (vector of samples) in one call instead of one sample with cross-call gradient accumulation; mean/variance (and the backward sums, with a corrected total_n = n*plane normalizer distinct from the per-sample `plane` used for channel indexing) are computed across every sample in the call, matching Darknet's batched statistics. Verified two ways: (1) a new finite-difference gradient check in training_smoke.cpp with two genuinely different samples in one CPU batch (batch_bn_grad_check, numeric vs analytic within ~1%), and (2) a new CUDA/CPU parity case in cuda_training_smoke.cpp (bn_distinct_batch, two different samples, losses and weights match to ~1e-6) exercising the new batch_norm_statistics_batched/batch_norm_backward_reduce_batched kernels - all 15 CTest suites still pass. Re-ran the same small-scale 64x64 voc-smoke.cfg/20-epoch GPU retrain (same images/batch/augmentation as FOLLOW-UP 2, this laptop build lacking OpenCV so JPEGs were converted to PPM via the new native/tools/jpg_to_ppm.py first) with true-batch BN now included: mAP@0.5 = 0.00028, i.e. still not meaningfully different from the ~0.001-0.002 floor seen without it. This is a THIRD piece of evidence (after overfit_smoke's correctness proof and FOLLOW-UP 2's ignore_thresh/augmentation result) that none of the three originally-named fidelity gaps (ignore_thresh, full augmentation, true-batch BN) is the dominant cause at this training budget - all three are now implemented with no effect on mAP. See todo for the resulting decision."
  - component: native/src/training.cpp and native/include/detector/trainer.hpp
    responsibility: CPU YOLO trainer - anchor-IoU target assignment, BCE objectness/offset/class loss, log-space w/h loss, SGD with weight decay and classic momentum, shortcut (residual) layer forward+backward, trainable batch normalization (gamma/beta learned; running mean/variance updated by EMA from each call's batch statistics), true minibatch SGD (step() takes the whole minibatch - a vector of samples - in one call and applies one averaged update; `batch_size` only bounds how many samples a call may hold, 2026-10-06), and a burn-in + step-decay LearningRateSchedule. train_main.cpp exposes --batch, --burn-in, --steps/--scales, --momentum (2026-10-08, default 0.9, see below), --flip-probability, --exposure-jitter/--saturation-jitter/--hue-jitter (full HSV augmentation via rgb_to_hsv/hsv_to_rgb round trip, 2026-10-05, superseding the earlier brightness-only exposure jitter), --crop-jitter (random per-edge crop before letterboxing via the new detector::crop() image helper, remapping/clipping/dropping labels accordingly - Darknet's crop-only variant of its aspect/scale "jitter") and --backend cpu|cuda (cuda dispatches to CudaTrainer, see below - this CPU trainer is the reference/parity oracle for it). No multi-GPU path (project trains on one laptop GPU by requirement). `Trainer`/`CudaTrainer` constructors gained a `momentum` parameter (2026-10-08, req-22, default 0.9f matching Darknet's cfg) between `weight_decay` and `bn_momentum`; per-parameter velocity buffers (zero-initialized, persisting across step() calls) implement `velocity = momentum*velocity + averaged_grad(+decay*param for weights); param -= lr*velocity`, so a trainer's first step() is unaffected by momentum (velocity starts at zero) and momentum=0 is exactly the old plain-SGD formula. Verified by a new focused regression test (native/tests/training_smoke.cpp, momentum != 0 vs momentum == 0 after two fixed-sample steps, matching the predicted lr*momentum*g1 difference) and by the existing CPU/GPU parity suite (now exercising the real momentum code path). Remaining Darknet-fidelity gap - no multiscale/random network-resizing during training (fixed 416x416 input; only crop-jitter, not Darknet's resize-jitter) - on top of the already-deprioritized-by-request dropout/reorg/RNN-family layers (see network.cpp entry). CAUTION found while adding momentum - its ~1/(1-momentum) steady-state step-size amplification destabilized two pre-existing LR-tuned tests at their original learning rates (native/tests/overfit_smoke.cpp's two scenarios, previously 0.1/0.05, and native/tests/cuda_training_smoke.cpp's bn_distinct_batch case, previously 0.05) even though CPU and GPU still matched each other exactly while diverging (not a parity bug, a tuning one); all three were rescaled by roughly (1-momentum) (to 0.01/0.005/0.01) and now pass, including overfit_smoke's decisive correctness check (scores now >0.999, IoU >0.99, better than before). Any other momentum=0.9 training run must use an LR tuned for momentum, not reuse a plain-SGD LR unchanged.
    contracts: Batch-norm mean/variance are computed across every sample passed to one step() call (and each channel's H*W positions), i.e. true minibatch statistics, not a per-sample approximation (2026-10-06, see cuda_training.cu entry's FOLLOW-UP 3 for the verification and retrain result). The BN backward was validated with finite-difference gradient checks (native/tests/training_smoke.cpp - bn_grad_check for a single sample, batch_bn_grad_check for two different samples in one batch; gamma/beta/weight, <2% relative error) before relying on it. A 64x64 VOC pilot with the pre-2026-10-01 trainer reached only 0.00113 validation mAP@0.5 and did not train YOLOv3-tiny or a useful detector. Re-run 2026-10-01 with the extended trainer (native/tests/voc-smoke.cfg given batch_normalize=1 on its feature convs to actually exercise the new BN training, --batch 8 --burn-in 50 --flip-probability 0.5, 500 train/200 val images, 3 epochs, CPU) - training loss fell monotonically each epoch (20.67 -> 18.44 -> 16.32), confirming the new mechanics work, but mAP@0.5 was still only 0.00196 on the small val subset - 3 epochs on 500 images is far too little budget for a from-scratch detector (the historical useful checkpoint needed 10,000 Darknet batches on the full set); this was not a regression, just insufficient training scale for a quick verification run.
  - component: native/tools and native/docker
    responsibility: Convert VOC2007, prepare an external original-Darknet training run, monitor checkpoints, export the selected Darknet weights to ONNX, and (jpg_to_ppm.py, 2026-10-06) convert a JPEG/PNG directory to PPM for native training/eval runs on this laptop build, which has no OpenCV configured (-DDETECTOR_OPENCV=ON needs an OpenCV CMake package this build doesn't have; native reads only PPM without it).
    contracts: The historical 10,000-batch Jetson-trained YOLOv3-tiny checkpoint reached 0.57379 validation and 0.55534 test mAP@0.5; source, data, weights and run artifacts stay outside Git. Future training is on the laptop.
  - component: Native YOLOv3-tiny VOC2007 full-budget run
    responsibility: Reproducible laptop GPU training result and validation comparison for the first native-trained detector above the near-zero mAP floor.
    contracts: "Training used 4,510 VOC2007 train images (PPM), yolov3-tiny-voc.cfg, --init data/yolov3-tiny.weights --init-layers 15 --backend cuda --batch 32 --epochs 71 --lr 0.001 --burn-in 1000 --steps 8000,9000 --scales .1,.1 --flip-probability 0.5 --exposure-jitter 0.3 --saturation-jitter 0.3 --hue-jitter 0.1 --crop-jitter 0.2; 320,210 images total. The final locally ignored checkpoint is runs/yolov3-tiny-voc-pretrained-full-budget.weights, SHA-256 47acf2166dcb6757ac86215593a67561eb0450773f2134c26c0da03dfd3dd734; training log .agent-work/full_retrain_pretrained.log ended at epoch 71, mean_loss=2.45951 on 2026-10-08 06:06 local. Native CUDA evaluator at confidence 0.01 and class-aware NMS IoU 0.45 gave mAP@0.5=0.25712 on all 501 val images (1,305 non-difficult objects); same cfg/evaluator/data gave 0.57612 for the historical external-Darknet final.weights (the earlier JPEG evaluation reported 0.57379). Evaluation logs are .agent-work/full_retrain_pretrained_eval.log and .agent-work/darknet_baseline_eval.log. A second run with the same recipe plus momentum=0.9, box-scale-by-area and no per-target normalization (runs/yolov3-tiny-voc-pretrained-full-budget-corrected.weights, SHA-256 25acc5731ca6ba53b25db0350a0564550acad2661d6bef78e17b969df6809841; training log .agent-work/full_retrain_corrected.log, finished epoch 71 mean_loss=9.41512 on 2026-10-09 08:08 local) scored mAP@0.5=0.59801 on the same val set/evaluator settings (.agent-work/full_retrain_corrected_eval.log) - above the external-Darknet baseline. Neither native checkpoint has been evaluated on the held-out test split yet; do that before selecting a checkpoint for deployment."
  - component: native/src/yolo_loss.cpp loss fidelity (background objectness, box scale, normalization)
    responsibility: Shared CPU/CUDA YOLO loss - penalize non-assigned, non-ignored anchor/cell predictions; scale matched coordinate loss by box size; sum deltas without per-target normalization (all matching Darknet's yolo_layer.c).
    contracts: "The full-budget 0.25712-mAP checkpoint was trained with negative BCE/objectness weight 0.5/N, N=2535 for 416x416 YOLOv3-tiny (about 0.000197 per candidate), whereas original pjreddie/darknet yolo_layer.c uses an unscaled 0-output delta per negative. Corrected 2026-10-08 to unit BCE weight; native/tests/training_smoke.cpp asserts 0.5 gradient at logit zero independent of anchor/cell count, and CUDA parity plus synthetic overfit checks pass. Paired 512-image fine-tunes from the same old checkpoint at LR 0.0001/seed 2026 yielded old loss 0.25388 mAP@0.5 and 14,249,968 predictions versus corrected loss 0.16388 and 8,180,383 on the same 501-image val set; a corrected 2048-image fine-tune yielded 0.12042 and 2,213,789. Thus the correction suppresses excess predictions but has not demonstrated an AP gain by warm-starting a model trained under the old objective. A fresh controlled retrain is required to measure its effect on accuracy. Two further Darknet-fidelity gaps closed 2026-10-08 (req-22): (1) matched targets' x/y/width/height loss and gradient are now scaled by `2 - truth.w*truth.h` (truth fractions of the network input; `Assignment::box_scale`, set at anchor-assignment time), matching delta_yolo_box in yolo_layer.c - up-weights small boxes; objectness/class loss stay unscaled. (2) the per-image `loss /= max(1,targets.size())` and matching gradient division were removed entirely - Darknet sums every target's full-scale delta with no such normalization, only averaging across the minibatch once in the trainer's SGD update. Both verified by a new training_smoke.cpp case (cx=cy=0 forces each offset's target to exactly 0, isolating the scale factor: unscaled gradient is sigmoid(0)-0=0.5, so the matched offset gradient must equal 0.5*box_scale) plus the full CPU/CUDA parity and overfit_smoke suites (all still pass). A fresh full-budget retrain (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, same recipe as the prior run - see 'Native YOLOv3-tiny VOC2007 full-budget run' above - plus these fixes and the new default momentum=0.9) measured the combined effect of all three corrections (background-objectness weight, box-scale, no per-target normalization, momentum) together: mAP@0.5 jumped from 0.25712 to 0.59801 on the same validation set/evaluator settings, now above the 0.57612 external-Darknet baseline, confirming these were the dominant cause of the prior gap rather than training budget."
  - component: native/src/trt_session.cpp and native Jetson evaluator
    responsibility: Optional ONNX/TensorRT FP32 or FP16 deployment using the shared YOLO decoder and evaluator.
    contracts: On the historical checkpoint, Jetson FP16 reached 0.55595 test mAP@0.5 and 11.970 ms in-memory pipeline mean versus 100.786 ms for native CUDA; engines are built on Jetson and are not portable.
  - component: native/tests and CTest
    responsibility: Smoke checks for graph inference, detector training, metrics, classifier training, IDX handling and CLI/data/export helpers.
    contracts: CMake registers native C++ tests and Python helper tests; CUDA classifier CLI tests require DETECTOR_CUDA, and the ONNX export test requires numpy, onnx and onnxruntime. Historical test results in docs are not a fresh validation of this untracked worktree. native/tests/overfit_smoke.cpp (added 2026-10-05, CPU-only by design - it is a correctness check on trivial synthetic data, not a training-scale benchmark) overfits mini.cfg and voc-smoke.cfg on fixed single/multi-target examples for thousands of steps and asserts the decoded detection recovers the ground-truth box with score>0.9 and IoU>0.8; ~205-430s on this laptop depending on concurrent CPU load (Release build - Debug is far too slow for this test, ~20x+), the slowest test in the suite by a wide margin since it is the only one that runs thousands of real training steps rather than a handful. native/tests/training_smoke.cpp also gained an ignore_thresh regression test (2026-10-05, native/tests/ignore-thresh.cfg) - a hand-crafted yolo_loss_and_gradient call with a non-assigned anchor whose decoded box exactly matches the target asserts its objectness-negative gradient is suppressed when ignore_thresh is met and not suppressed when disabled. detector_train_augmentation (native/tests/test_detector_train_augmentation.py, 2026-10-05) runs cuda_detector_train with every jitter flag (flip/exposure/saturation/hue/crop) enabled on tiny synthetic images and asserts training completes with a finite loss and a saved checkpoint - a pipeline smoke test, not a per-pixel correctness proof.
