  - component: native/src/cuda_training.cu, native/include/detector/cuda_trainer.hpp, native/src/yolo_loss.cpp/native/include/detector/yolo_loss.hpp
    responsibility: CUDA/GPU training backend for the detector graph (CudaTrainer), mirroring the CPU Trainer - conv/batch-norm/shortcut/route/upsample/maxpool forward+backward as CUDA kernels, true-batch SGD (one step() call takes the whole minibatch and applies one update), the same LearningRateSchedule; the YOLO anchor-assignment/loss is factored into shared yolo_loss.cpp/hpp so CPU and GPU use identical loss math. train_main.cpp's `--backend cpu|cuda` selects it; `--backend cuda` requires -DDETECTOR_CUDA=ON. Device buffers are sized for `batch_size` sample-major blocks; step() accepts between 1 and `batch_size` samples (a smaller final partial batch is fine).
    contracts: "Verified by a CPU/GPU parity test (native/tests/cuda_training_smoke.cpp, registered under DETECTOR_CUDA) that trains matched-seed CPU and GPU copies of the same cfg for several steps and asserts every weight/bias/scale/mean/variance matches within tight relative tolerance - passing with ~1e-6 max diff (2026-10-05) across a batch-normalized 5-step case and two shortcut-layer cases (plain and with minibatching). A real bug was found and fixed this way - the batch_norm_apply and batch_norm_backward_dz kernels were missing their thread bounds check ('if (pos >= count) return;'), so overhang threads from the rounded-up launch grid wrote past buffer ends and corrupted other device buffers (caught via a weight diverging to ~0 vs the CPU's real value after one step); fixed by adding the bounds check and the missing count/elements argument at both call sites. The early trainer had no multi-GPU path; see the later Multi-GPU CUDA detector training entry. GPU retrain on the 64x64 toy voc-smoke.cfg (2026-10-05, 20 epochs/90,240 images at batch 8, ~15 min on the RTX 3070 Ti) and a second retrain on the REAL yolov3-tiny-voc.cfg at 416x416 (2026-10-05, 3 epochs/13,530 images at batch 8, ~46 min, ~175 ms/image) both converged loss cleanly (16.34->5.52 and 10.07->5.39 respectively) but left validation mAP@0.5 at ~0.002 either way. CORRECTED ANALYSIS (superseding this entry's earlier same-day claim that this 'rules out undertraining'): that claim compared this trainer's minibatch COUNT (batch=8) against the historical run's batch COUNT (10,000), but the historical Darknet run used batch=32 per step, i.e. ~320,000 images total - both GPU retrains above (90,240 and 13,530 images) are actually 3.5x and ~24x UNDER that proven budget, not over it. A full line-by-line audit of yolo_loss.cpp's anchor-assignment/encode and network.cpp's decode (which is independently validated by the historical checkpoint's 0.57 mAP through this same decode/metrics code) found them mathematically symmetric and consistent, as is the duplicated training-time forward pass in training.cpp against network.cpp's inference forward (same conv/maxpool/BN formulas) - no clear correctness bug surfaced. Known, already-documented simplifications remain (no Darknet-style ignore_thresh for near-miss anchors, per-sample not true-batch BN statistics, brightness-only jitter) that could slow convergence relative to full Darknet fidelity. FOLLOW-UP (2026-10-05, native/tests/overfit_smoke.cpp, req-14): the line-by-line audit above was necessary but not sufficient proof, so this adds a decisive dynamic check - overfitting fixed, noise-free synthetic examples for thousands of CPU steps removes the capacity/budget/dataset-noise variables entirely. Two scenarios both converge to score>0.999 and IoU>0.83 against their ground-truth box: (1) mini.cfg, one head, one anchor, one class, one target; (2) voc-smoke.cfg itself (the actual two-head/multi-anchor/20-class architecture used by the failing retrains), two targets of different classes/scales that the anchor-IoU logic must route to different heads and cells. This is decisive: the anchor-assignment/loss-encode/backward/decode round trip CAN learn correct, confident localization from scratch when the example is trivial, which rules out a hard correctness bug in that machinery as the cause of the near-zero mAP. The remaining gap is therefore most likely the proven ~15h+/320,000-image training budget not yet being met, and/or real-VOC-specific difficulty (class imbalance across 20 classes, multiple/ambiguous objects per image, no ignore_thresh, weaker augmentation than Darknet) rather than a hidden bug in this tested machinery - see todo for the next decision. FOLLOW-UP 2 (2026-10-05, req-15 'b first'): added ignore_thresh (Darknet near-miss suppression - a predicted box already overlapping a target by >= the cfg's ignore_thresh, default 0.7, skips objectness-negative loss; Layer::ignore_thresh, parsed in network.cpp, applied in the shared yolo_loss.cpp so both CPU and GPU trainers get it for free) plus full crop/HSV training augmentation (see training.cpp entry below), then re-ran the exact same 64x64 voc-smoke.cfg/20-epoch/90,240-image GPU retrain for a controlled comparison: mAP@0.5 = 0.00118, i.e. NOT meaningfully different from the pre-fidelity 0.00196/~0.002 baselines. This is a second piece of evidence (after the overfit_smoke correctness proof) against 'missing fidelity' as the dominant cause at this budget - reinforcing that the ~15h+/320,000-image training budget gap is still the leading explanation. True-batch BN statistics (the third named fidelity item) was deliberately NOT attempted this run: it requires restructuring both Trainer and CudaTrainer from single-sample forward+immediate-backward into a two-pass batched design (a stats pass over the whole minibatch, then a train pass normalizing with those stats), which is invasive enough to risk the parity-tested CUDA trainer and warrants its own dedicated session with new gradient-check tests, not a drive-by change. FOLLOW-UP 3 (2026-10-06, req-16 'b'): implemented true-batch BN statistics for real - both Trainer::step and CudaTrainer::step now take a minibatch (vector of samples) in one call instead of one sample with cross-call gradient accumulation; mean/variance (and the backward sums, with a corrected total_n = n*plane normalizer distinct from the per-sample `plane` used for channel indexing) are computed across every sample in the call, matching Darknet's batched statistics. Verified two ways: (1) a new finite-difference gradient check in training_smoke.cpp with two genuinely different samples in one CPU batch (batch_bn_grad_check, numeric vs analytic within ~1%), and (2) a new CUDA/CPU parity case in cuda_training_smoke.cpp (bn_distinct_batch, two different samples, losses and weights match to ~1e-6) exercising the new batch_norm_statistics_batched/batch_norm_backward_reduce_batched kernels - all 15 CTest suites still pass. Re-ran the same small-scale 64x64 voc-smoke.cfg/20-epoch GPU retrain (same images/batch/augmentation as FOLLOW-UP 2, this laptop build lacking OpenCV so JPEGs were converted to PPM via the new native/tools/jpg_to_ppm.py first) with true-batch BN now included: mAP@0.5 = 0.00028, i.e. still not meaningfully different from the ~0.001-0.002 floor seen without it. This is a THIRD piece of evidence (after overfit_smoke's correctness proof and FOLLOW-UP 2's ignore_thresh/augmentation result) that none of the three originally-named fidelity gaps (ignore_thresh, full augmentation, true-batch BN) is the dominant cause at this training budget - all three are now implemented with no effect on mAP. See todo for the resulting decision."
  - component: native/src/training.cpp and native/include/detector/trainer.hpp
    responsibility: CPU YOLO trainer - anchor-IoU target assignment, BCE objectness/offset/class loss, log-space w/h loss, SGD with weight decay and classic momentum, shortcut (residual) layer forward+backward, trainable batch normalization (gamma/beta learned; running mean/variance updated by EMA from each call's batch statistics), true minibatch SGD (step() takes the whole minibatch - a vector of samples - in one call and applies one averaged update; `batch_size` only bounds how many samples a call may hold, 2026-10-06), and a burn-in + step-decay LearningRateSchedule. train_main.cpp exposes --batch, --burn-in, --steps/--scales, --momentum (2026-10-08, default 0.9, see below), --flip-probability, --exposure-jitter/--saturation-jitter/--hue-jitter (full HSV augmentation via rgb_to_hsv/hsv_to_rgb round trip, 2026-10-05, superseding the earlier brightness-only exposure jitter), --crop-jitter (random per-edge crop before letterboxing via the new detector::crop() image helper, remapping/clipping/dropping labels accordingly - Darknet's crop-only variant of its aspect/scale "jitter") and --backend cpu|cuda (cuda dispatches to CudaTrainer, see below - this CPU trainer is the reference/parity oracle for it). The early trainer had no multi-GPU path; see the later Multi-GPU CUDA detector training entry. `Trainer`/`CudaTrainer` constructors gained a `momentum` parameter (2026-10-08, req-22, default 0.9f matching Darknet's cfg) between `weight_decay` and `bn_momentum`; per-parameter velocity buffers (zero-initialized, persisting across step() calls) implement `velocity = momentum*velocity + averaged_grad(+decay*param for weights); param -= lr*velocity`, so a trainer's first step() is unaffected by momentum (velocity starts at zero) and momentum=0 is exactly the old plain-SGD formula. Verified by a new focused regression test (native/tests/training_smoke.cpp, momentum != 0 vs momentum == 0 after two fixed-sample steps, matching the predicted lr*momentum*g1 difference) and by the existing CPU/GPU parity suite (now exercising the real momentum code path). Multiscale/resize-jitter training (2026-10-12, closed the last named fidelity gap) - `Network::resize(width, height)` (network.hpp/cpp) recomputes every layer's input/output Shape in place for a new square input size, reusing a new shared `layer_output_shape` helper now also called by `from_cfg` itself (so the two code paths can never silently diverge) - it touches no learned parameter (weights/biases/scales/means/variances), only shape bookkeeping. `Trainer::resize` is a thin forward to it (CPU step() already allocates its activation buffers fresh from the network's current shapes each call, so no CPU-side buffers need resizing). `CudaTrainer::resize` (cuda_training.cu) additionally reallocates only the spatial-dimension-sized device buffers (input, per-layer output/gradient/preactivation/raw, maxpool's max_index) via a new `DeviceMemory::replace` helper - every per-channel buffer (weights, biases, scales, BN running stats, SGD velocities, gradient accumulators) is left untouched since a resize never changes channel counts, so learned parameters and momentum/BN state survive exactly like Darknet's own resize_network (unlike a destroy-and-reconstruct CudaTrainer would). `train_main.cpp` exposes `--multiscale-min/--multiscale-max` (positive multiples of 32, min<=max; disabled when unset) and `--multiscale-interval` (default 10, Darknet's period) - every `interval` completed minibatches, train_loop picks a new random square multiple-of-32 dimension in that range and calls `trainer.resize()`; letterboxing already reads `network.input_shape()` fresh per image so subsequent images automatically target the new size. Verified by a `Network::resize` unit test (native/tests/smoke.cpp) on mini.cfg (doubling 4x4 to 8x8, asserting every layer's recomputed shape and that weights are byte-identical to before the resize); a new CPU/GPU parity case (native/tests/cuda_training_smoke.cpp's `resize_mid_training` - trains a few steps at 4x4, resizes both trainers to 8x8, trains a few more, and asserts every learned parameter still matches within the suite's usual tight tolerance - the decisive cross-check for CudaTrainer's device-buffer reallocation, the highest-risk part of this feature); and an extended CLI smoke test (test_detector_train_augmentation.py, `--multiscale-min 32 --multiscale-max 64 --multiscale-interval 1`) that completes with a finite loss. All 15 CTest suites pass. Saved weights files store no width/height (only per-channel parameters), so a checkpoint trained with multiscale resizing is unaffected at inference time - the cfg file alone fixes the deployed input size. CAUTION found while adding momentum - its ~1/(1-momentum) steady-state step-size amplification destabilized two pre-existing LR-tuned tests at their original learning rates (native/tests/overfit_smoke.cpp's two scenarios, previously 0.1/0.05, and native/tests/cuda_training_smoke.cpp's bn_distinct_batch case, previously 0.05) even though CPU and GPU still matched each other exactly while diverging (not a parity bug, a tuning one); all three were rescaled by roughly (1-momentum) (to 0.01/0.005/0.01) and now pass, including overfit_smoke's decisive correctness check (scores now >0.999, IoU >0.99, better than before). Any other momentum=0.9 training run must use an LR tuned for momentum, not reuse a plain-SGD LR unchanged. Real step/epoch-resume support (2026-10-14) - `Trainer`/`CudaTrainer` gained an `initial_iteration` constructor parameter (default 0) and an `iteration()` getter; `train_main.cpp` writes a sidecar "`<output>.step`" file ("`<iteration> <completed_epochs>`") alongside every checkpoint save, and a new `--resume-from <weights>` CLI flag (mutually exclusive with `--init`/`--init-layers`) full-loads those weights, reads the matching sidecar, seeds the trainer's step counter from it, and continues the epoch loop from `completed_epochs+1` toward the same `--epochs` target instead of restarting burn-in/step-decay at iteration 0 against already-trained weights (the exact limitation hit twice by the YOLOv2 full-budget retrain's crash/resume episodes, now fixed for future relaunches - that already-running retrain is unaffected, having started before this fix). Per-image position within an epoch is not persisted (each epoch's image order is freshly shuffled regardless, so there is nothing meaningful to resume there); SGD momentum velocity buffers are also not persisted across a process restart (reset to zero, same as every resume before this fix) - only the LR-schedule/epoch-loop step count is now exact. Verified by a new training_smoke.cpp case - an uninterrupted 5-step run's per-step LR sequence and final weights are reproduced exactly by a simulated crash-and-resume (2 steps, capture `iteration()`, a **new** `Trainer` instance seeded with that count finishes the remaining 3 steps on the same network) - both the per-step LR values and final weights match to tight tolerance, isolating the schedule-continuation fix per the user's explicit test requirement.
    contracts: Batch-norm mean/variance are computed across every sample passed to one step() call (and each channel's H*W positions), i.e. true minibatch statistics, not a per-sample approximation (2026-10-06, see cuda_training.cu entry's FOLLOW-UP 3 for the verification and retrain result). The BN backward was validated with finite-difference gradient checks (native/tests/training_smoke.cpp - bn_grad_check for a single sample, batch_bn_grad_check for two different samples in one batch; gamma/beta/weight, <2% relative error) before relying on it. A 64x64 VOC pilot with the pre-2026-10-01 trainer reached only 0.00113 validation mAP@0.5 and did not train YOLOv3-tiny or a useful detector. Re-run 2026-10-01 with the extended trainer (native/tests/voc-smoke.cfg given batch_normalize=1 on its feature convs to actually exercise the new BN training, --batch 8 --burn-in 50 --flip-probability 0.5, 500 train/200 val images, 3 epochs, CPU) - training loss fell monotonically each epoch (20.67 -> 18.44 -> 16.32), confirming the new mechanics work, but mAP@0.5 was still only 0.00196 on the small val subset - 3 epochs on 500 images is far too little budget for a from-scratch detector (the historical useful checkpoint needed 10,000 Darknet batches on the full set); this was not a regression, just insufficient training scale for a quick verification run.
