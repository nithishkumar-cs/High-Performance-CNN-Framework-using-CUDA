  - item: Finish the laptop Docker image build, validate a GPU training preflight and full training run, select its checkpoint on validation data, then deploy only that artifact to Jetson for inference.
  - item: If a YOLOv8n/Ultralytics comparison baseline is later published or distributed, resolve its AGPL-3.0 licensing first; this baseline is not part of the current native worktree.
