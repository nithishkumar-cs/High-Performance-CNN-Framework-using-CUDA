project:
  purpose: Independently written, reusable C++/CUDA neural-network framework inspired by Darknet, supporting configurable training and inference across models, with Jetson inference as a deployment target.
  current_state: The `git revert be906e4` is committed as ffa01ab on main (one commit ahead of origin/main); the earlier PyTorch/ONNX YOLO tooling is removed and the original CUDA CNN (CNN.py, CNNcuda.py, layer.cu/h, main.cu, mnist.h, Makefile) is restored and tracked. The CMake-based native C++/CUDA framework, docs/ and this DESIGN.yaml remain untracked in the worktree (a separate, larger commit to do next). Native CPU/CUDA inference and single-sample classifier SGD work; YOLOv3-tiny is an inference/evaluation workload. A useful VOC2007 checkpoint came from external original Darknet training on Jetson before the laptop-only decision; native detector training remains experimental and has not produced a useful model. Laptop Docker training is documented but its image build and GPU run are unverified; a laptop Docker `nvidia-smi` preflight (RTX 3070 Ti Laptop GPU, 8192 MiB) passed 2026-10-01.

requirements:
  - requirement: Build on the user's original CUDA CNN repository and keep its Git history; implement a trainable multi-model framework, not only a YOLOv3-tiny application.
  - requirement: Train future models on this laptop's RTX 3070 Ti; use the Jetson Orin for inference and evaluation only. The older Jetson-trained checkpoint remains a historical baseline.
  - requirement: Implement the framework independently without forking or copying Darknet source. Compatibility is limited to the supported config layers and Darknet-format weights; unsupported layers fail explicitly.
  - requirement: Preserve native CPU/CUDA inference and Jetson deployment. ONNX export and TensorRT inference are optional paths for the same trained weights, not prerequisites for native inference.
  - requirement: Evaluate comparable models and report dataset, checkpoint origin, metric definition and timing scope. The VOC AP@0.5 values use converted labels without difficult objects and are not official VOC or COCO leaderboard scores.
  - requirement: Run long jobs without opening visible extra terminals.
banned:
  - item: Treat YOLOv3-tiny inference or weights trained by original Darknet as proof that this framework can train a useful detector.
    reason: The user asked for a trainable C/CUDA framework; native detector training has not achieved that result.
  - item: Use Jetson for future training runs.
    reason: The user chose laptop-only training and Jetson-only inference.
  - item: Reintroduce unrelated PyTorch/Ultralytics implementation as the project core or compare YOLOv8n as if it were the same Darknet model.
    reason: The user corrected that scope; Ultralytics may be used only for a genuinely comparable baseline.
  - item: Fabricate, backdate, or auto-generate (e.g. via an activity-generator tool) commit dates/history to make the work look older or predate this assistance.
    reason: The user asked for spread-out weekend-dated commits going back a year; the assistant refused and the user accepted an honest history going forward instead (commits may still note a genuine, evidence-backed approximate prior timeline in prose, not in commit dates).
architecture:
  - component: Git remote and Jetson deployment environment
    responsibility: Source control for this repo and the remote target used for inference/deployment benchmarking (never training).
    contracts: "GitHub origin `nithishkumar-cs/High-Performance-CNN-Framework-using-CUDA`, commits authored as `Nithish Kumar <nithishk.cs@gmail.com>`; pushes to `main` need the user's explicit approval each time (sandbox auto-review blocks unapproved pushes). Jetson reachable via SSH alias `jetson-ts` (also `jetson`): a Jetson Orin Nano Super on JetPack R36.5 with TensorRT 10.3; benchmarks default to the board's 25W mode unless stated otherwise."
  - component: Root CMakeLists.txt, original CUDA CNN, and native CLI programs
    responsibility: Build the newer detector_core C++17 library and detector/classifier inspect, train, evaluate and benchmark executables while retaining the original fixed-shape MNIST CUDA CNN as project history.
    contracts: CMake options DETECTOR_CUDA, DETECTOR_OPENCV and DETECTOR_TENSORRT select optional backends; TensorRT requires CUDA. The restored original CNN files are committed; CMakeLists.txt and native/ are still untracked in the worktree.
  - component: native/src/network.cpp and native/src/cuda_backend.cu
    responsibility: Config-driven graph and CPU/CUDA inference for convolution, max-pooling, dense, route, upsample, YOLO heads and terminal softmax; load/save supported Darknet-format weights.
    contracts: The graph supports YOLOv3-tiny inference plus shortcut (residual-add) layers for CPU and CUDA (2026-10-01, `native/tests/shortcut.cfg` regression test), which is the layer needed to parse full YOLOv3/Darknet-53 configs; those full configs are still unvalidated end-to-end. Dropout, reorg and RNN-family layers from upstream Darknet remain unimplemented (low priority, not requested).
  - component: native/src/classifier_trainer.cpp and native/src/cuda_classifier_trainer.cu
    responsibility: CPU/CUDA single-sample SGD for sequential linear, MLP and small CNN classifiers with softmax/cross-entropy; IDX/MNIST CLI and examples.
    contracts: CUDA trainer lacks branched-graph backprop and trainable batch normalization; full MNIST Jetson runs reached 97.24% test accuracy for the MLP and 97.27% for the small CNN.
  - component: native/src/training.cpp and native/include/detector/trainer.hpp
    responsibility: Experimental CPU YOLO trainer - anchor-IoU target assignment, BCE objectness/offset/class loss, log-space w/h loss, SGD with weight decay, now extended (2026-10-01) with shortcut (residual) layer forward+backward, trainable batch normalization (gamma/beta learned; running mean/variance updated by EMA every sample), minibatching via gradient accumulation over `batch_size` step() calls applying one averaged update, and a burn-in + step-decay LearningRateSchedule. train_main.cpp exposes --batch, --burn-in, --steps/--scales, --flip-probability and --exposure-jitter (brightness-only; no full HSV or crop/geometric jitter yet). This CPU-only trainer is why `cuda_detector_train` trains on CPU despite the laptop RTX 3070 Ti - the name matches the CUDA-enabled build config (which does provide CUDA for inference and for the separate classifier trainer in native/src/cuda_classifier_trainer.cu), but nobody has written GPU backward kernels for this detector graph (conv/BN/shortcut/route/upsample backward plus the YOLO loss) - writing a correct, fast CUDA training backward pass for this whole graph is comparable in size to everything done so far in this training-gap effort and needs its own dedicated, explicitly-scoped phase; not attempted without confirming the user wants that investment given CPU training already works. No multi-GPU path either (doubly not applicable while there is no single-GPU CUDA training path, and the project trains on one laptop GPU by requirement).
    contracts: Batch-norm statistics are computed per sample over its own H*W spatial positions (no literal cross-sample batched tensor), not true minibatch statistics - a disclosed approximation. The BN backward was validated with a finite-difference gradient check (native/tests/training_smoke.cpp, gamma/beta/weight, <2% relative error) before relying on it. A 64x64 VOC pilot with the pre-2026-10-01 trainer reached only 0.00113 validation mAP@0.5 and did not train YOLOv3-tiny or a useful detector. Re-run 2026-10-01 with the extended trainer (native/tests/voc-smoke.cfg given batch_normalize=1 on its feature convs to actually exercise the new BN training, --batch 8 --burn-in 50 --flip-probability 0.5, 500 train/200 val images, 3 epochs, CPU) - training loss fell monotonically each epoch (20.67 -> 18.44 -> 16.32), confirming the new mechanics work, but mAP@0.5 was still only 0.00196 on the small val subset - 3 epochs on 500 images is far too little budget for a from-scratch detector (the historical useful checkpoint needed 10,000 Darknet batches on the full set); this was not a regression, just insufficient training scale for a quick verification run.
  - component: native/tools and native/docker
    responsibility: Convert VOC2007, prepare an external original-Darknet training run, monitor checkpoints, and export the selected Darknet weights to ONNX.
    contracts: The historical 10,000-batch Jetson-trained YOLOv3-tiny checkpoint reached 0.57379 validation and 0.55534 test mAP@0.5; source, data, weights and run artifacts stay outside Git. Future training is on the laptop.
  - component: native/src/trt_session.cpp and native Jetson evaluator
    responsibility: Optional ONNX/TensorRT FP32 or FP16 deployment using the shared YOLO decoder and evaluator.
    contracts: On the historical checkpoint, Jetson FP16 reached 0.55595 test mAP@0.5 and 11.970 ms in-memory pipeline mean versus 100.786 ms for native CUDA; engines are built on Jetson and are not portable.
  - component: native/tests and CTest
    responsibility: Smoke checks for graph inference, detector training, metrics, classifier training, IDX handling and CLI/data/export helpers.
    contracts: CMake registers native C++ tests and Python helper tests; CUDA classifier CLI tests require DETECTOR_CUDA, and the ONNX export test requires numpy, onnx and onnxruntime. Historical test results in docs are not a fresh validation of this untracked worktree.
