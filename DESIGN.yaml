  - component: Native CUDA detector training performance
    responsibility: Use cuBLAS matrix multiplication and parallel reductions for large detector training convolutions and batch normalization while preserving the shared CPU/CUDA loss and optimizer behavior.
    contracts: 'A 2026-10-22 Nsight Systems pilot on real YOLOv2 batch 16 found direct nested-loop convolution kernels taking 75.7% of GPU kernel time and serial per-channel batch-norm reductions taking 23.7%; CPU use and disk traffic were low while GPU use was 100%. The prior blocking-sync fix cut a full-run epoch from ~12.4h to ~4.46h, but thermal throttling remained active at 87C/1230MHz and code kernels were the larger measured opportunity. CudaTrainer now uses im2col/col2im plus full FP32 cuBLAS SGEMM for convolutional forward and both backward passes, and tiled double-precision partial sums for minibatch BN mean/variance and backward reductions. No cuDNN install is needed; CUDA::cublas ships with CUDAToolkit. A same-seed 160-image pilot on the unchanged epoch-37 checkpoint took 86.58s on the old kernels, 30.71s after cuBLAS alone, and 9.93s with both changes; all runs had mean_loss 16.8987 and 387 positives. Across 67,158,114 checkpoint floats, old versus final had max absolute difference 7.63e-6 and RMS 5.20e-9, with no differences above 1e-3. All 15 CTest suites pass. At active LR 0.001 (burn-in disabled to match the resumed schedule), an additional same-seed 160-image pilot took 79.29s old versus 7.91s optimized, both with mean_loss 16.8457 and 387 positives; checkpoints had max absolute difference 2.91e-4, RMS 3.92e-7 and no float difference above 1e-3. The first two complete optimized epochs saved at 14:35:57 and 14:39:09 local took about 4m24s (including relaunch setup) and 3m12s, respectively, each 282 minibatches. During epoch 39 the GPU still hit 87C/1050MHz, yet training maintained the short-pilot speedup. Further sustained monitoring remains useful.'
