    responsibility: Smoke checks for graph inference, detector training, metrics, classifier training, IDX handling and CLI/data/export helpers.
    contracts: CMake registers native C++ tests and Python helper tests; CUDA classifier CLI tests require DETECTOR_CUDA, and the ONNX export test requires numpy, onnx and onnxruntime. Historical test results in docs are not a fresh validation of this untracked worktree. native/tests/overfit_smoke.cpp (added 2026-10-05, CPU-only by design - it is a correctness check on trivial synthetic data, not a training-scale benchmark) overfits mini.cfg and voc-smoke.cfg on fixed single/multi-target examples for thousands of steps and asserts the decoded detection recovers the ground-truth box with score>0.9 and IoU>0.8; ~205-430s on this laptop depending on concurrent CPU load (Release build - Debug is far too slow for this test, ~20x+), the slowest test in the suite by a wide margin since it is the only one that runs thousands of real training steps rather than a handful. native/tests/training_smoke.cpp also gained an ignore_thresh regression test (2026-10-05, native/tests/ignore-thresh.cfg) - a hand-crafted yolo_loss_and_gradient call with a non-assigned anchor whose decoded box exactly matches the target asserts its objectness-negative gradient is suppressed when ignore_thresh is met and not suppressed when disabled. detector_train_augmentation (native/tests/test_detector_train_augmentation.py, 2026-10-05) runs cuda_detector_train with every jitter flag (flip/exposure/saturation/hue/crop) enabled on tiny synthetic images and asserts training completes with a finite loss and a saved checkpoint - a pipeline smoke test, not a per-pixel correctness proof.
