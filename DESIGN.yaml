  - component: Native YOLOv3-tiny VOC2007 full-budget run
    responsibility: Reproducible laptop GPU training result and validation comparison for the first native-trained detector above the near-zero mAP floor.
    contracts: "Training used 4,510 VOC2007 train images (PPM), yolov3-tiny-voc.cfg, --init data/yolov3-tiny.weights --init-layers 15 --backend cuda --batch 32 --epochs 71 --lr 0.001 --burn-in 1000 --steps 8000,9000 --scales .1,.1 --flip-probability 0.5 --exposure-jitter 0.3 --saturation-jitter 0.3 --hue-jitter 0.1 --crop-jitter 0.2; 320,210 images total. The final locally ignored checkpoint is runs/yolov3-tiny-voc-pretrained-full-budget.weights, SHA-256 47acf2166dcb6757ac86215593a67561eb0450773f2134c26c0da03dfd3dd734; training log .agent-work/full_retrain_pretrained.log ended at epoch 71, mean_loss=2.45951 on 2026-10-08 06:06 local. Native CUDA evaluator at confidence 0.01 and class-aware NMS IoU 0.45 gave mAP@0.5=0.25712 on all 501 val images (1,305 non-difficult objects); same cfg/evaluator/data gave 0.57612 for the historical external-Darknet final.weights (the earlier JPEG evaluation reported 0.57379). Evaluation logs are .agent-work/full_retrain_pretrained_eval.log and .agent-work/darknet_baseline_eval.log. A second run with the same recipe plus momentum=0.9, box-scale-by-area and no per-target normalization (runs/yolov3-tiny-voc-pretrained-full-budget-corrected.weights, SHA-256 25acc5731ca6ba53b25db0350a0564550acad2661d6bef78e17b969df6809841; training log .agent-work/full_retrain_corrected.log, finished epoch 71 mean_loss=9.41512 on 2026-10-09 08:08 local) scored mAP@0.5=0.59801 on the same val set/evaluator settings (.agent-work/full_retrain_corrected_eval.log) - above the external-Darknet baseline. Evaluated 2026-10-12 on the full VOC2007 test split (4,952 images, 12,032 non-difficult objects, JPEGs converted via jpg_to_ppm.py into runs/ppm/test): mAP@0.5=0.58182, 31,667 predictions (.agent-work/full_retrain_corrected_test_eval.log) - above the historical external-Darknet test score (0.55534), selecting this checkpoint for Jetson deployment evaluation."
  - component: native/src/yolo_loss.cpp loss fidelity (background objectness, box scale, normalization)
    responsibility: Shared CPU/CUDA YOLO loss - penalize non-assigned, non-ignored anchor/cell predictions; scale matched coordinate loss by box size; sum deltas without per-target normalization (all matching Darknet's yolo_layer.c).
    contracts: "The full-budget 0.25712-mAP checkpoint was trained with negative BCE/objectness weight 0.5/N, N=2535 for 416x416 YOLOv3-tiny (about 0.000197 per candidate), whereas original pjreddie/darknet yolo_layer.c uses an unscaled 0-output delta per negative. Corrected 2026-10-08 to unit BCE weight; native/tests/training_smoke.cpp asserts 0.5 gradient at logit zero independent of anchor/cell count, and CUDA parity plus synthetic overfit checks pass. Paired 512-image fine-tunes from the same old checkpoint at LR 0.0001/seed 2026 yielded old loss 0.25388 mAP@0.5 and 14,249,968 predictions versus corrected loss 0.16388 and 8,180,383 on the same 501-image val set; a corrected 2048-image fine-tune yielded 0.12042 and 2,213,789. Thus the correction suppresses excess predictions but has not demonstrated an AP gain by warm-starting a model trained under the old objective. A fresh controlled retrain is required to measure its effect on accuracy. Two further Darknet-fidelity gaps closed 2026-10-08 (req-22): (1) matched targets' x/y/width/height loss and gradient are now scaled by `2 - truth.w*truth.h` (truth fractions of the network input; `Assignment::box_scale`, set at anchor-assignment time), matching delta_yolo_box in yolo_layer.c - up-weights small boxes; objectness/class loss stay unscaled. (2) the per-image `loss /= max(1,targets.size())` and matching gradient division were removed entirely - Darknet sums every target's full-scale delta with no such normalization, only averaging across the minibatch once in the trainer's SGD update. Both verified by a new training_smoke.cpp case (cx=cy=0 forces each offset's target to exactly 0, isolating the scale factor: unscaled gradient is sigmoid(0)-0=0.5, so the matched offset gradient must equal 0.5*box_scale) plus the full CPU/CUDA parity and overfit_smoke suites (all still pass). A fresh full-budget retrain (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, same recipe as the prior run - see 'Native YOLOv3-tiny VOC2007 full-budget run' above - plus these fixes and the new default momentum=0.9) measured the combined effect of all three corrections (background-objectness weight, box-scale, no per-target normalization, momentum) together: mAP@0.5 jumped from 0.25712 to 0.59801 on the same validation set/evaluator settings, now above the 0.57612 external-Darknet baseline, confirming these were the dominant cause of the prior gap rather than training budget."
