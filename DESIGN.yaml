  - component: Native YOLOv3-tiny VOC2007 full-budget run
    responsibility: Reproducible laptop GPU training result and validation comparison for the first native-trained detector above the near-zero mAP floor.
    contracts: "Training used 4,510 VOC2007 train images (PPM), yolov3-tiny-voc.cfg, --init data/yolov3-tiny.weights --init-layers 15 --backend cuda --batch 32 --epochs 71 --lr 0.001 --burn-in 1000 --steps 8000,9000 --scales .1,.1 --flip-probability 0.5 --exposure-jitter 0.3 --saturation-jitter 0.3 --hue-jitter 0.1 --crop-jitter 0.2; 320,210 images total. The final locally ignored checkpoint is runs/yolov3-tiny-voc-pretrained-full-budget.weights, SHA-256 47acf2166dcb6757ac86215593a67561eb0450773f2134c26c0da03dfd3dd734; training log .agent-work/full_retrain_pretrained.log ended at epoch 71, mean_loss=2.45951 on 2026-10-08 06:06 local. Native CUDA evaluator at confidence 0.01 and class-aware NMS IoU 0.45 gave mAP@0.5=0.25712 on all 501 val images (1,305 non-difficult objects); same cfg/evaluator/data gave 0.57612 for the historical external-Darknet final.weights (the earlier JPEG evaluation reported 0.57379). Evaluation logs are .agent-work/full_retrain_pretrained_eval.log and .agent-work/darknet_baseline_eval.log. A second run with the same recipe plus momentum=0.9, box-scale-by-area and no per-target normalization (runs/yolov3-tiny-voc-pretrained-full-budget-corrected.weights, SHA-256 25acc5731ca6ba53b25db0350a0564550acad2661d6bef78e17b969df6809841; training log .agent-work/full_retrain_corrected.log, finished epoch 71 mean_loss=9.41512 on 2026-10-09 08:08 local) scored mAP@0.5=0.59801 on the same val set/evaluator settings (.agent-work/full_retrain_corrected_eval.log) - above the external-Darknet baseline. Evaluated 2026-10-12 on the full VOC2007 test split (4,952 images, 12,032 non-difficult objects, JPEGs converted via jpg_to_ppm.py into runs/ppm/test): mAP@0.5=0.58182, 31,667 predictions (.agent-work/full_retrain_corrected_test_eval.log) - above the historical external-Darknet test score (0.55534), selecting this checkpoint for Jetson deployment evaluation."
  - component: native/src/yolo_loss.cpp loss fidelity (background objectness, box scale, normalization)
    responsibility: Shared CPU/CUDA YOLO loss - penalize non-assigned, non-ignored anchor/cell predictions; scale matched coordinate loss by box size; sum deltas without per-target normalization (all matching Darknet's yolo_layer.c).
    contracts: "The full-budget 0.25712-mAP checkpoint was trained with negative BCE/objectness weight 0.5/N, N=2535 for 416x416 YOLOv3-tiny (about 0.000197 per candidate), whereas original pjreddie/darknet yolo_layer.c uses an unscaled 0-output delta per negative. Corrected 2026-10-08 to unit BCE weight; native/tests/training_smoke.cpp asserts 0.5 gradient at logit zero independent of anchor/cell count, and CUDA parity plus synthetic overfit checks pass. Paired 512-image fine-tunes from the same old checkpoint at LR 0.0001/seed 2026 yielded old loss 0.25388 mAP@0.5 and 14,249,968 predictions versus corrected loss 0.16388 and 8,180,383 on the same 501-image val set; a corrected 2048-image fine-tune yielded 0.12042 and 2,213,789. Thus the correction suppresses excess predictions but has not demonstrated an AP gain by warm-starting a model trained under the old objective. A fresh controlled retrain is required to measure its effect on accuracy. Two further Darknet-fidelity gaps closed 2026-10-08 (req-22): (1) matched targets' x/y/width/height loss and gradient are now scaled by `2 - truth.w*truth.h` (truth fractions of the network input; `Assignment::box_scale`, set at anchor-assignment time), matching delta_yolo_box in yolo_layer.c - up-weights small boxes; objectness/class loss stay unscaled. (2) the per-image `loss /= max(1,targets.size())` and matching gradient division were removed entirely - Darknet sums every target's full-scale delta with no such normalization, only averaging across the minibatch once in the trainer's SGD update. Both verified by a new training_smoke.cpp case (cx=cy=0 forces each offset's target to exactly 0, isolating the scale factor: unscaled gradient is sigmoid(0)-0=0.5, so the matched offset gradient must equal 0.5*box_scale) plus the full CPU/CUDA parity and overfit_smoke suites (all still pass). A fresh full-budget retrain (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, same recipe as the prior run - see 'Native YOLOv3-tiny VOC2007 full-budget run' above - plus these fixes and the new default momentum=0.9) measured the combined effect of all three corrections (background-objectness weight, box-scale, no per-target normalization, momentum) together: mAP@0.5 jumped from 0.25712 to 0.59801 on the same validation set/evaluator settings, now above the 0.57612 external-Darknet baseline, confirming these were the dominant cause of the prior gap rather than training budget."
  - component: native/src/trt_session.cpp and native Jetson evaluator
    responsibility: Optional ONNX/TensorRT FP32 or FP16 deployment using the shared YOLO decoder and evaluator.
    contracts: "On the historical checkpoint, Jetson FP16 reached 0.55595 test mAP@0.5 and 11.970 ms in-memory pipeline mean versus 100.786 ms for native CUDA; engines are built on Jetson and are not portable. Deployed and benchmarked the corrected checkpoint (yolov3-tiny-voc-pretrained-full-budget-corrected.weights, 0.59801 val/0.58182 test mAP@0.5 on the laptop) on Jetson 2026-10-12: exported to ONNX (export_darknet_onnx.py, SHA-256 692ba3711c1b92c49266ee574ee936fb045891f61c04ec0c34d9af9e78636d24), transferred with VOC val/test JPEGs (scp, no PPM conversion needed - the Jetson build has OpenCV 4.8.0 already installed) to ~/projects/native-detector, built there with -DDETECTOR_CUDA=ON -DDETECTOR_TENSORRT=ON -DDETECTOR_OPENCV=ON -DCMAKE_CUDA_ARCHITECTURES=87 -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc (nvcc is not on the default non-interactive SSH PATH on this Jetson, unlike cmake/ninja), all 14 CTest suites passing. Built both corrected-fp32.engine and corrected-fp16.engine via trtexec from that ONNX. Native CUDA, TensorRT FP32 and TensorRT FP16 all scored within noise of each other and of the laptop's native-CUDA numbers: val mAP@0.5 0.60006/0.60016/0.59888, test mAP@0.5 0.58119/0.58103/0.58066 - all above the historical checkpoint's 0.57379 val/0.55534 test. Pipeline/network timing essentially unchanged from the historical checkpoint since the architecture is identical: native CUDA 100.346/91.138 ms, TensorRT FP32 19.083/6.386 ms, TensorRT FP16 12.216/3.742 ms (pipeline/network mean, 5 warmup + 30 iterations, same held-out test image, board's current persistent power mode - nvpmodel -q needs an interactive sudo password so it was not queried/changed this run). This checkpoint is therefore the selected deployment artifact; its engines/ONNX/logs live only on the Jetson and under the laptop's ignored runs/ (reproducible via the recorded SHA-256 and CLI commands, not committed)."
  - component: Native CUDA detector training performance
    responsibility: Use cuBLAS matrix multiplication and parallel reductions for large detector training convolutions and batch normalization while preserving the shared CPU/CUDA loss and optimizer behavior.
    contracts: 'A 2026-10-22 Nsight Systems pilot on real YOLOv2 batch 16 found direct nested-loop convolution kernels taking 75.7% of GPU kernel time and serial per-channel batch-norm reductions taking 23.7%; CPU use and disk traffic were low while GPU use was 100%. The prior blocking-sync fix cut a full-run epoch from ~12.4h to ~4.46h, but thermal throttling remained active at 87C/1230MHz and code kernels were the larger measured opportunity. CudaTrainer now uses im2col/col2im plus full FP32 cuBLAS SGEMM for convolutional forward and both backward passes, and tiled double-precision partial sums for minibatch BN mean/variance and backward reductions. No cuDNN install is needed; CUDA::cublas ships with CUDAToolkit. A same-seed 160-image pilot on the unchanged epoch-37 checkpoint took 86.58s on the old kernels, 30.71s after cuBLAS alone, and 9.93s with both changes; all runs had mean_loss 16.8987 and 387 positives. Across 67,158,114 checkpoint floats, old versus final had max absolute difference 7.63e-6 and RMS 5.20e-9, with no differences above 1e-3. All 15 CTest suites pass. At active LR 0.001 (burn-in disabled to match the resumed schedule), an additional same-seed 160-image pilot took 79.29s old versus 7.91s optimized, both with mean_loss 16.8457 and 387 positives; checkpoints had max absolute difference 2.91e-4, RMS 3.92e-7 and no float difference above 1e-3. The first two complete optimized epochs saved at 14:35:57 and 14:39:09 local took about 4m24s (including relaunch setup) and 3m12s, respectively, each 282 minibatches. During epoch 39 the GPU still hit 87C/1050MHz, yet training maintained the short-pilot speedup. Further sustained monitoring remains useful.'
  - component: native/tests and CTest
    responsibility: Smoke checks for graph inference, detector training, metrics, classifier training, IDX handling and CLI/data/export helpers.
    contracts: CMake registers native C++ tests and Python helper tests; CUDA classifier CLI tests require DETECTOR_CUDA, and the ONNX export test requires numpy, onnx and onnxruntime. Historical test results in docs are not a fresh validation of this untracked worktree. native/tests/overfit_smoke.cpp (added 2026-10-05, CPU-only by design - it is a correctness check on trivial synthetic data, not a training-scale benchmark) overfits mini.cfg and voc-smoke.cfg on fixed single/multi-target examples for thousands of steps and asserts the decoded detection recovers the ground-truth box with score>0.9 and IoU>0.8; ~205-430s on this laptop depending on concurrent CPU load (Release build - Debug is far too slow for this test, ~20x+), the slowest test in the suite by a wide margin since it is the only one that runs thousands of real training steps rather than a handful. native/tests/training_smoke.cpp also gained an ignore_thresh regression test (2026-10-05, native/tests/ignore-thresh.cfg) - a hand-crafted yolo_loss_and_gradient call with a non-assigned anchor whose decoded box exactly matches the target asserts its objectness-negative gradient is suppressed when ignore_thresh is met and not suppressed when disabled. detector_train_augmentation (native/tests/test_detector_train_augmentation.py, 2026-10-05) runs cuda_detector_train with every jitter flag (flip/exposure/saturation/hue/crop) enabled on tiny synthetic images and asserts training completes with a finite loss and a saved checkpoint - a pipeline smoke test, not a per-pixel correctness proof.
  - component: Global average-pooling cfg layer
    responsibility: Collapse each channel's complete spatial plane to one mean for classifiers or detectors.
    contracts: "Added 2026-10-27 as `[avgpool]` and upstream's `[avg]` alias. For each NCHW sample/channel, forward computes the H*W arithmetic mean and yields shape Cx1x1; backward adds each output gradient divided by H*W to every input position. CPU/CUDA inference, detector minibatch training, classifier SGD, and recurrent classifier chunks support it. Hand-computed channel means and gradients, CPU/CUDA inference parity, and detector/classifier parameter parity (including an RNN sequence) pass. No learned parameters or Darknet weight-file payload. Optional ONNX export does not yet recognize this layer."
  - component: Sample-wide L2-normalization cfg layer
    responsibility: Provide a shape-preserving `[l2norm]` layer for CPU/CUDA inference and detector/classifier training, including recurrent classifier chunks.
    contracts: "Added 2026-10-27. For each sample's complete flattened tensor x, forward computes y=x/sqrt(sum(x_i^2)+1e-12); backward applies the complete Jacobian-vector product rather than an elementwise approximation. No learned parameters or weight-file payload. CPU and CUDA paths agree in inference; a central finite-difference test validates the input gradient, including nonuniform upstream gradients. Detector minibatch CPU/CUDA parity and classifier SGD parity (single-step and RNN sequence) pass. The CUDA implementation uses one block per sample, adequate for this niche layer but not yet benchmarked at large spatial sizes. ONNX export does not yet recognize this optional layer."
  - component: Channel-local response normalization cfg layer
    responsibility: Provide `[normalization]` across native CPU/CUDA inference and detector/classifier training, including recurrent classifier chunks.
    contracts: "Added 2026-10-28. Each NCHW output channel c at a spatial position is input[c] / (kappa + alpha * sum(input[neighbor]^2 over the channel window))^beta, with clipped boundary windows and an exact cross-channel Jacobian-vector product in backward. Config options: size=5, alpha=0.0001, beta=0.75, kappa=1 by default; positive size/kappa and nonnegative alpha/beta required. No learned parameters or weight-file payload. A hand-computed four-channel forward case, finite-difference gradient check, CPU/CUDA inference parity, detector minibatch parameter parity, and classifier SGD/sequence parity pass. CUDA kernels are direct per-element implementations; large-channel performance is not benchmarked. The standard symmetric window differs from a historical off-by-one channel-window indexing bug in pjreddie/darknet's normalization_layer.c, so loading an upstream model that uses that layer is not claimed byte-compatible. ONNX export does not yet recognize this optional layer."
  - component: Locally connected [local] and transposed [deconvolutional] cfg layers
    responsibility: Provide spatially unshared filters and transposed convolution across native CPU/CUDA inference and detector/classifier training, including recurrent classifier chunks.
    contracts: "Added 2026-10-28 (req-70). `[local]` has filters/size/stride/pad and activation linear|leaky|logistic (default logistic, as upstream); weights are ordered location, filter, input-kernel and biases are per output element, so the parameter count depends on the input size and Network::resize rejects it. `[deconvolutional]` has output = stride*(in-1)+size-2*pad, weights ordered [input channel][filter][ky][kx], per-filter biases, same activations; batch_normalize is rejected explicitly. Both serialize bias-then-weights; byte-compatibility with upstream Darknet weight files is not claimed. Verified by hand-computed outputs, finite-difference input/weight/bias gradient checks, CPU/CUDA inference parity, detector minibatch parity (cuda_training_smoke) and classifier single-step plus RNN-sequence parity. CUDA kernels are direct per-element gathers (no cuBLAS/cuDNN), unbenchmarked at large sizes; the CUDA classifier SGD weight kernels loop over samples per weight. ONNX export does not recognize these layers. All 19 CTest suites pass (CUDA Release)."
  - component: Jetson deployment of YOLOv2 and full YOLOv3
    responsibility: Run the second and third native-trained detector architectures directly through native CUDA and optionally through ONNX/TensorRT FP32 or FP16 on the Jetson Orin Nano Super.
    contracts: "Completed 2026-10-27 after generalizing ONNX export to region/reorg/shortcut and arbitrary detection heads, and TensorRT to one or three heads. Synced the native tree to the Jetson; 18/18 CTest passed; built FP32 and FP16 engines for both architectures. On VOC2007 test (4,952 images, 12,032 non-difficult objects; confidence 0.01, class-aware NMS IoU 0.45), Jetson native CUDA / TensorRT FP32 / TensorRT FP16 mAP@0.5: YOLOv2 0.57177/0.57176/0.57151 versus laptop CUDA 0.57215; full YOLOv3/Darknet-53 0.61502/0.61479/0.61517 versus laptop CUDA 0.61593. Native cuda_detector benchmark on held-out test image 002570.jpg, network-forward only, 5 warmups and 30 iterations (preprocessing/decode/NMS/file I/O/setup excluded): YOLOv2 CUDA/FP32/FP16 mean 577.504/13.336/7.140 ms; full YOLOv3 1246.484/25.476/11.082 ms. TensorRT engines were built on the Jetson and are not portable. The val split also matched laptop scores within noise: YOLOv2 0.56016/0.56010/0.55988; full YOLOv3 0.62139/0.62140/0.62143."
  - component: Multi-GPU CUDA detector training
    responsibility: Run one model replica per selected CUDA device on disjoint minibatch shards and synchronize training state after each global step.
    contracts: "Added 2026-10-27. `cuda_detector_train --backend cuda --gpus 0,1 --batch N` treats N as the total batch size, requires distinct available devices and N >= GPU count, and splits each batch into balanced shards; `--gpus 0` preserves the single-GPU path. `MultiCudaTrainer` runs the per-device `CudaTrainer::step()` calls concurrently, then averages weights, biases, BN scales, momentum velocities, and BN running mean/variance by each shard's sample count, broadcasting the result to all replicas and advancing idle replicas' iteration after a smaller final batch. LR schedule, resize jitter and checkpoint step count remain global. Each device computes its own batch-normalization statistics during forward/backward; the synchronized running statistics are a weighted average, not a cross-device exact batch-normalization calculation. Host-mediated tensor gather/broadcast is correctness-first; cross-device transfer throughput remains unmeasured. On this laptop, `nvidia-smi` reports exactly one RTX 3070 Ti GPU, so an actual two-device run cannot be validated here. Verification: `cuda_training_smoke.cpp` compares 1+2 sample splits (including two momentum steps and an idle-replica partial batch) with an unsplit 3-sample CUDA minibatch on a no-BN cfg, checks BN state averaging separately, and `test_detector_gpu_selection.py` trains via `--gpus 0` and rejects duplicate indices. Validation passed: all 18 CTest suites in the default CUDA Release build and the focused CUDA training, GPU-selection and cuDNN smoke tests in a separate cuDNN Release build. Darknet's own reference uses model replicas and periodic weight averaging (`src/network.c` / `examples/detector.c`); this independent implementation synchronizes every step and also averages optimizer/BN state."
  - component: Deeper MNIST CNN classifier validation
    responsibility: Exercise a second, deeper sequential classifier graph end to end through native CUDA training and CPU/CUDA inference.
    contracts: "Added `native/examples/mnist-deep-conv.cfg` 2026-10-27: 28x28 grayscale -> 8-filter 3x3 conv -> 2x2 maxpool -> 16-filter 3x3 conv -> 2x2 maxpool -> 64-unit leaky connected -> 10-unit connected -> softmax. This checks two conv/pool stages and a hidden dense layer rather than the earlier one-conv MNIST example. Native `cuda_classifier train`, seed 2026, LR 0.01, no weight decay, sample-wise SGD, three epochs over all 60,000 MNIST training images on the laptop RTX 3070 Ti: epoch mean losses 0.131075/0.053979/0.038460, train accuracy 0.958817/0.983600/0.987517. Checkpoint `runs/mnist/deep-cnn-full-20261027.weights` (gitignored, SHA-256 aeca7f625a307cb9012e4821814c71c818cfa74c0a1f7234d204be8bd049920) scored 9,849/10,000 = 98.49% on the held-out MNIST test split with both native CUDA and CPU evaluators (exact same correct count). Evaluation scope is IDX sample conversion plus forward only, excluding IDX file I/O and model setup: CUDA mean 0.131536 ms/sample, CPU mean 0.604649 ms/sample on the laptop; these are not Jetson timing numbers. This exceeds the historical small one-conv classifier's 97.27% MNIST test accuracy, though that run was on Jetson and no architecture search was performed. Training/evaluation logs are `.agent-work/logs/deep_cnn_full_train-1793118288.log`, `deep_cnn_test_eval-1793118355.log`, and `deep_cnn_cpu_test_eval-1793118366.log`."
  - component: Native segmentation example pipelines
    responsibility: Train semantic pixel classifiers and class-agnostic per-detection masks with the cfg graph, and run mask inference through the existing detector.
    contracts: "Added 2026-10-29. VectorTrainer::pixel_softmax_ce treats a terminal CxHxW raw-logit tensor as C mutually exclusive classes per pixel, normalizes loss/gradient by labeled pixels and ignores target -1. cuda_segmenter trains/evaluates fixed-record CHW-input plus HxW-ID data, reporting pixel accuracy and mean class IoU. cuda_instance_segmenter trains a separate one-channel sigmoid-BCE mask head on RGB ROI plus binary-mask records; at prediction it takes existing detector boxes, crops each original image ROI, letterboxes it to the mask cfg, predicts one binary mask per box on CPU or CUDA, maps it back and writes per-instance PGM files plus instances.tsv. Both heads train on CPU (default) or CUDA (`--backend cuda`): CudaClassificationTrainer gained a vector-loss mode (ctor `std::optional<VectorLoss>`, `step_vector()`, forward()/backward() split out of step(); loss computed host-side exactly like VectorTrainer, layers/SGD on GPU), CPU/CUDA parity-tested for mse, sigmoid_bce and pixel_softmax_ce (classifier_smoke.cpp) plus a segmentation_cli_cuda CLI test. Eval stays CPU. The detector and mask network can both infer on CUDA. Mask training is separate from detector training and mask-only eval uses GT crops, not end-to-end instance AP. Added VOC2007 semantic/object-mask manifest and vecbin packers (Pillow/NumPy), including semantic 255-void -> -1 and per-object palette IDs; this laptop's VOC2007 segmentation train split packed 209 semantic images and 633 object regions at 32x32. Synthetic CLI train/eval convergence, exact CE gradient/ignored-pixel checks, CPU/CUDA mask projection, and packer tests pass. Fixed a missing CUDA plain-terminal-head download exposed by the mask path. Real VOC2007 GPU runs (2026-10-29; only 209 train / 213 val semantic images, 633/582 mask ROIs): native/examples/segmenter-deep.cfg (64x64 conv/maxpool/deconv, 400 epochs, lr 0.05, ~4 min) gives mean IoU 0.302 train / 0.060 val (pixel acc 0.82 / 0.71) - overfits; mask head (32x32, 60 epochs) gives 0.482 train / 0.468 val GT-crop mask IoU. Logs/weights in runs/voc-seg (gitignored). No end-to-end instance AP, TensorRT export or Jetson mask benchmark yet."
