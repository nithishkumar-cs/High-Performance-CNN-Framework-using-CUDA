# CIFAR-10 image classifier (Darknet's cifar.c example): two convolutional stages over the
# 3x32x32 RGB input and a hidden dense layer, same sample-wise-SGD classifier trainer as the
# MNIST examples (no batch normalization).
[net]
channels=3
height=32
width=32

[convolutional]
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[connected]
output=128
activation=leaky

[connected]
output=10
activation=linear

[softmax]
