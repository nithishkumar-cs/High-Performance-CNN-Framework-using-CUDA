# Class-agnostic binary mask for an RGB crop of one detected object. Train it on
# image ROI + instance mask pairs; detector boxes are supplied separately at inference.
[net]
channels=3
height=32
width=32

[convolutional]
filters=8
size=3
stride=1
pad=1
activation=leaky

[convolutional]
filters=1
size=1
stride=1
pad=0
activation=linear
