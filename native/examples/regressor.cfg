# Darknet's regressor.c example: predicts a 3-value regression target from a small grayscale
# input via mean-squared error (VectorTrainer, no [softmax]/[yolo] head).
[net]
channels=1
height=8
width=8

[convolutional]
filters=8
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[connected]
output=16
activation=leaky

[connected]
output=3
activation=linear
