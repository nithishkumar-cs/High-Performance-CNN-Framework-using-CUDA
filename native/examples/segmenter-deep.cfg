# VOC2007 21-class 64x64 encoder-decoder segmenter (two maxpool downsamples, two
# deconvolution upsamples) for the CUDA pixel-softmax trainer.
[net]
channels=3
height=64
width=64

[convolutional]
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=64
size=3
stride=1
pad=1
activation=leaky

[deconvolutional]
filters=32
size=2
stride=2
pad=0
activation=leaky

[deconvolutional]
filters=21
size=2
stride=2
pad=0
activation=linear
