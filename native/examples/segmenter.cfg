# VOC2007's 21-class, 32x32 semantic segmentation example. The final channel planes
# are raw per-pixel logits; targets are 32x32 integer class IDs in a .vecbin record.
[net]
channels=3
height=32
width=32

[convolutional]
filters=8
size=3
stride=1
pad=1
activation=leaky

[convolutional]
filters=21
size=1
stride=1
pad=0
activation=linear
