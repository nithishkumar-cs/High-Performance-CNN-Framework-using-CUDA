# Darknet's tag.c example: multi-label image tagging, independent per-output sigmoid + binary
# cross-entropy (VectorTrainer's sigmoid_bce loss), no [softmax].
[net]
channels=1
height=8
width=8

[convolutional]
filters=8
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[connected]
output=16
activation=leaky

[connected]
output=4
activation=linear
