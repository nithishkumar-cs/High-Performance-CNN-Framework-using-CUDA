# Small, independently defined two-head detector for native training smoke tests.
# 20 Pascal VOC classes; not the original YOLOv3-tiny network.
[net]
channels=3
height=64
width=64

[convolutional]
batch_normalize=1
filters=16
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=2
pad=1
activation=leaky

[convolutional]
filters=75
size=1
stride=1
activation=linear

[yolo]
mask=3,4,5
anchors=4,6,8,10,12,16,20,24,32,40,48,56
classes=20

[route]
layers=3

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
activation=leaky

[upsample]
stride=2

[route]
layers=-1,2

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[convolutional]
filters=75
size=1
stride=1
activation=linear

[yolo]
mask=0,1,2
anchors=4,6,8,10,12,16,20,24,32,40,48,56
classes=20
